<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Admin ProClik</title>

<link rel="stylesheet" href="../n1.css?v=2">
<script src="../espace-depart/config.js?v=2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<style>
:root{--bg:var(--n1-bg);--fg:var(--n1-fg);--mu:var(--n1-muted);--li:var(--n1-line);--nu:var(--n1-nuit);--nf:var(--n1-nuit-fg);--la:var(--n1-laiton);--ca:var(--n1-calme);
 --f:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f);-webkit-text-size-adjust:100%}
body{padding:max(16px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.wrap{max-width:860px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
header svg{width:34px;height:34px;flex:none}
header h1{font-size:20px;margin:0;letter-spacing:-.01em}
header small{display:block;color:var(--mu);font-size:13px;font-weight:500}
header .sp{flex:1}
button,input,select{font:inherit;color:inherit}
.btn{min-height:44px;padding:10px 16px;border:0;border-radius:14px;background:var(--ca);box-shadow:var(--n1-pk);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
a.btn{text-decoration:none;color:inherit}
.btn.go{background:var(--nu);color:var(--nf);box-shadow:var(--n1-go-sh)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:12px}
.btn.al{color:var(--n1-alert)}
.btn:disabled{opacity:.55}
.card{background:var(--ca);border-radius:20px;box-shadow:var(--n1-calme-sh);padding:16px;margin:0 0 14px}
.card h2{font-size:16px;margin:0 0 4px}
.mu{color:var(--mu);font-size:13.5px}
label.f{display:block;margin:10px 0 0;font-size:13px;font-weight:700;color:var(--mu)}
input.t,select.t,textarea.t{display:block;width:100%;margin-top:4px;min-height:46px;padding:10px 14px;border:0;border-radius:14px;background:var(--bg);box-shadow:var(--n1-in);font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 160px}
.err{color:var(--n1-alert);font-size:13.5px;min-height:18px;margin:8px 0 0}
.tabs{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;white-space:nowrap;padding:0 12px;min-height:42px;border:0;border-radius:14px;background:transparent;font-weight:700;color:var(--mu);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ca);color:var(--fg);box-shadow:var(--n1-pk)}
.cl{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:0;cursor:pointer}
.cl .n{flex:1;min-width:0}
.cl b{font-size:16px;display:block}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--n1-teinte);margin:4px 4px 0 0}
.pill.ok{color:var(--n1-ok)}.pill.w{color:var(--n1-warn)}.pill.al{color:var(--n1-alert)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;padding:8px 12px;border-radius:14px;background:var(--bg);cursor:pointer;font-weight:600;font-size:14px}
.sw input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--li);box-shadow:var(--n1-in);position:relative;flex:none;cursor:pointer;margin:0;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked{background:var(--nu)}.sw input:checked::after{transform:translateX(18px)}
.sec{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.res{margin-top:12px;padding:12px;border-radius:14px;background:var(--bg);box-shadow:var(--n1-in)}
.res .big{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:.04em;word-break:break-all}
.jl{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--li);font-size:13.5px}
.jl:first-child{border-top:0}.jl time{color:var(--mu);flex:none;width:118px}
.mes{padding:10px 0;border-top:1px solid var(--li)}.mes:first-of-type{border-top:0}.mes-l{display:flex;gap:12px;align-items:flex-start;cursor:pointer}.mes-l input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--nu)}
.sm{padding:12px 0;border-top:1px solid var(--li)}.sm:first-child{border-top:0}
textarea.t{min-height:0;font:inherit;font-size:16px}
.back{border:0;background:transparent;font-weight:700;color:var(--mu);padding:8px 0;cursor:pointer;min-height:44px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--nu);color:var(--nf);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
 <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="30" r="22" fill="none" stroke="var(--nu)" stroke-width="7"/><circle cx="32" cy="29" r="4" fill="var(--la)"/></svg>
 <div><h1>Admin ProClik</h1><small>Vos clients, leurs accès et leurs options</small></div>
 <span class="sp"></span>
 <button class="btn sm" id="sortir" type="button" hidden>Sortir</button>
</header>

<!-- connexion -->
<section id="v-login" class="card" hidden>
 <h2>Accès Admin</h2>
 <p class="mu" style="margin:0">Réservé à Cyril. Tapez votre code Admin (celui posé dans Cloudflare). Après 5 erreurs, l'accès se bloque 15 minutes.</p>
 <input class="t" id="acode" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Code Admin" aria-label="Code Admin" style="margin-top:12px">
 <div id="aotpw" hidden><label class="f" for="aotp">Code à 6 chiffres de votre appli d'authentification</label><input class="t" id="aotp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123 456"></div>
 <div class="err" id="aerr"></div>
 <button class="btn go" id="ago" type="button" style="width:100%;margin-top:6px">Entrer</button>
</section>

<!-- liste -->
<section id="v-liste" hidden>
 <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="clients">Clients</button><button role="tab" aria-selected="false" data-tab="messages">Messages</button><button role="tab" aria-selected="false" data-tab="apprend">Cliky apprend</button><button role="tab" aria-selected="false" data-tab="journal">Journal</button><button role="tab" aria-selected="false" data-tab="reglages">Réglages</button></div>
 <div id="deuxfa-bandeau"></div>
 <div id="alertes-bandeau"></div>
 <div id="p-clients">
  <button class="btn go" id="nouveau" type="button" style="width:100%;margin-bottom:14px">+ Nouveau client</button>
  <div id="liste"></div>
  <button class="btn sm" id="voirarch" type="button" style="width:100%" hidden></button>
 </div>
 <div id="p-messages" hidden><div id="messages"></div></div>
 <div id="p-apprend" hidden><div id="banc"></div><div id="apprend"></div></div>
 <div id="p-journal" hidden><div class="card" id="journal"></div></div>
 <div id="p-reglages" hidden><div id="reglages"></div></div>
</section>

<!-- fiche client -->
<section id="v-fiche" hidden>
 <button class="back" id="retour" type="button">‹ Tous les clients</button>
 <div id="fiche"></div>
</section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){'use strict';
var S=String(window.PC_SERVICE||'').replace(/\/+$/,''),KJ='pc-admin-jeton';
var $=function(s){return document.querySelector(s)},esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function lj(){try{return sessionStorage.getItem(KJ)||''}catch(e){return ''}}
function sj(v){try{v?sessionStorage.setItem(KJ,v):sessionStorage.removeItem(KJ)}catch(e){}}
var NOMS={cliky:'Cliky',reservation:'Réservation',sms:'SMS',assistant:'Assistant du site',avis:'Avis Google',reseaux:'Réseaux sociaux',image:'Votre image',equipe:'Équipe',negoce:'Réseau négoce'};
var MENUS={clients:'Clients',devis:'Devis',factures:'Factures',depenses:'Dépenses',planning:'Planning',chantiers:'Chantiers',prix:'Achats',produits:'Produits',cotes:'Cotes',reseaux:'Réseaux'};
var DATA={clients:[],options:Object.keys(NOMS),menus:Object.keys(MENUS)},COUR=null;
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2400)}
function api(ch,o){o=o||{};var h={};if(lj())h.Authorization='Bearer '+lj();if(o.body)h['Content-Type']='application/json';
 return fetch(S+ch,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined}).then(function(r){return r.json().catch(function(){return{ok:false,erreur:'Réponse illisible du service'}}).then(function(j){
  if(j&&j.reconnexion){sj('');vue('login');throw new Error('Connexion expirée, retapez votre code.')}
  if(!r.ok||!j.ok){var er=new Error(j.erreur||('Erreur '+r.status));er.j=j;throw er}return j})},function(){throw new Error('Pas de réseau, ou service injoignable.')})}
window.PCADM={api:api,esc:esc,toast:toast};
function vue(v){['login','liste','fiche'].forEach(function(k){$('#v-'+k).hidden=k!==v});$('#sortir').hidden=v==='login';window.scrollTo(0,0)}

/* ---------- connexion ---------- */
function entrer(){var c=$('#acode').value.trim(),o=$('#aotp').value.replace(/\D/g,''),b=$('#ago');if(!c){$('#aerr').textContent='Le code est vide.';return}
 b.disabled=true;$('#aerr').textContent='';api('/admin/connexion',{method:'POST',body:o?{code:c,otp:o}:{code:c}}).then(function(j){sj(j.jeton);$('#acode').value='';$('#aotp').value='';$('#aotpw').hidden=true;charger()},
  function(e){if(e.j&&e.j.otp){$('#aotpw').hidden=false;setTimeout(function(){$('#aotp').focus()},50);if(!o){$('#aerr').textContent='';return}}$('#aerr').textContent=e.message}).then(function(){b.disabled=false})}
$('#aotp').addEventListener('keydown',function(e){if(e.key==='Enter')entrer()});
$('#ago').addEventListener('click',entrer);$('#acode').addEventListener('keydown',function(e){if(e.key==='Enter')entrer()});
$('#sortir').addEventListener('click',function(){sj('');vue('login')});

/* ---------- liste ---------- */
function etat(c){var p=[];
 p.push(c.actif?'<span class="pill ok">Actif</span>':'<span class="pill al">Accès coupé</span>');
 p.push('<span class="pill '+(c.acces==='mot de passe choisi'?'ok':c.acces==='pas encore d\'accès'?'w':'')+'">'+esc(c.acces)+'</span>');
 if(!c.secrets.ghl.pose)p.push('<span class="pill w">Clé GHL à poser</span>');
 if(!c.secrets.vf.pose)p.push('<span class="pill w">Clé VosFactures à poser</span>');
 return p.join('')}
var ARCH=false;
function depuis(iso){if(!iso)return 'jamais';var m=Math.round((Date.now()-Date.parse(iso))/60000);if(m<2)return 'à l\'instant';if(m<60)return 'il y a '+m+' min';var h=Math.round(m/60);if(h<48)return 'il y a '+h+' h';return 'il y a '+Math.round(h/24)+' j'}
function alerte(c){var a=[];if(c.sante&&c.sante.ghl&&!c.sante.ghl.ok&&c.secrets.ghl.pose)a.push('GHL ne répond pas');if(c.sante&&c.sante.vf&&!c.sante.vf.ok&&c.secrets.vf.pose)a.push('VosFactures ne répond pas');
 if(c.abo&&c.abo.statut==='retard')a.push('Paiement en retard');if(c.abo&&c.abo.statut==='suspendu')a.push('Espace en pause');return a}
function rendreListe(){var tous=DATA.clients.filter(function(c){return !!c.archive===ARCH}),na=DATA.clients.filter(function(c){return c.archive}).length;
 var va=$('#voirarch');va.hidden=!na&&!ARCH;va.textContent=ARCH?'‹ Revenir aux clients':'Voir les archivés ('+na+')';
 var L=tous.sort(function(a,b){return alerte(b).length-alerte(a).length||a.entreprise.localeCompare(b.entreprise)});
 $('#liste').innerHTML=L.length?L.map(function(c){var on=Object.keys(c.options||{}).filter(function(k){return c.options[k]}).map(function(k){return NOMS[k]||k});
  return '<div class="card"><button class="cl" type="button" data-id="'+esc(c.id)+'"><span class="n"><b>'+esc(c.entreprise||c.id)+'</b><span class="mu">'+(c.activite?esc(c.activite)+' · ':'')+esc(c.prenom||'')+(c.email?' · '+esc(c.email):'')+'</span><div>'+etat(c)+'</div>'+
   '<div class="mu" style="margin-top:6px">'+(alerte(c).length?'<span class="pill al">● '+esc(alerte(c).join(' · '))+'</span><br>':'')+'Vu '+esc(depuis(c.suivi&&c.suivi.vu))+(c.suivi&&c.suivi.derniere_demande?' · dernière demande '+esc(depuis(c.suivi.derniere_demande)):'')+'<br>'+(c.effectif?c.effectif+' personne'+(c.effectif>1?'s':'')+' · ':'')+'Options : '+(on.length?esc(on.join(', ')):'aucune')+(function(){var off=Object.keys(c.menus||{}).filter(function(k){return c.menus[k]===false}).map(function(k){return MENUS[k]||k});return off.length?' · Menus masqués : '+esc(off.join(', ')):''})()+'</div></span><span aria-hidden="true" style="font-size:22px;color:var(--mu)">›</span></button></div>'}).join(''):'<div class="card mu">Aucun client pour l\'instant.</div>'}
/* Alertes (17/11) : un service payant a lâché (crédit Claude, clé Google…). Seulement les nouvelles. */
function alertes(){api('/admin/alertes').then(function(j){var n=j.nouvelles||0,L=(j.alertes||[]).slice(0,n);if(!n){$('#alertes-bandeau').innerHTML='';return}
 $('#alertes-bandeau').innerHTML='<div class="card" style="border:1.5px solid var(--n1-alert)"><h2>⚠ '+(n>1?n+' alertes':'Une alerte')+' à regarder</h2>'+L.slice(0,5).map(function(a){return '<p style="margin:0 0 10px"><b>'+esc(a.titre)+'</b><br>'+esc(a.msg)+'.<br><span class="mu">'+esc(a.ou)+'</span><br><span class="pill w">'+esc(new Date(a.t).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}))+'</span>'+(a.mail==='envoyé'?'<span class="pill ok">e-mail envoyé</span>':'')+'</p>'}).join('')+(j.mail!=='branché'?'<p class="mu" style="margin:0 0 10px">E-mail d\'alerte pas encore branché (secret ALERTE_EMAIL).</p>':'')+'<button class="btn sm go" type="button" id="alok">C\'est réglé</button></div>';
 $('#alok').addEventListener('click',function(){api('/admin/alertes',{method:'POST',body:{}}).then(function(){$('#alertes-bandeau').innerHTML='';toast('Alertes marquées comme vues')},function(){})})},function(){})}
function charger(){return api('/admin/clients').then(function(j){DATA=j;bandeau2fa();alertes();vue(COUR?'fiche':'liste');rendreListe();if(COUR){var c=DATA.clients.filter(function(x){return x.id===COUR})[0];if(c)fiche(c)}},function(e){if(lj())toast(e.message)})}
$('#liste').addEventListener('click',function(e){var b=e.target.closest('[data-id]');if(!b)return;var c=DATA.clients.filter(function(x){return x.id===b.dataset.id})[0];if(c){COUR=c.id;fiche(c);vue('fiche')}});
$('#voirarch').addEventListener('click',function(){ARCH=!ARCH;rendreListe()});
$('#retour').addEventListener('click',function(){COUR=null;vue('liste');rendreListe()});
$('#nouveau').addEventListener('click',function(){COUR=null;fiche(null);vue('fiche')});
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(!b)return;
 [].forEach.call(document.querySelectorAll('[data-tab]'),function(x){x.setAttribute('aria-selected',x===b)});
 ['clients','messages','apprend','journal','reglages'].forEach(function(t){$('#p-'+t).hidden=b.dataset.tab!==t});if(b.dataset.tab==='apprend'){apprend();if(window.PCBANC)PCBANC()}if(b.dataset.tab==='journal')journal();if(b.dataset.tab==='messages')messages();if(b.dataset.tab==='reglages')reglages()});

/* ---------- fiche ---------- */
function champ(id,lab,val,type,aide){return '<label class="f" for="'+id+'">'+lab+'</label><input class="t" id="'+id+'" type="'+(type||'text')+'" value="'+esc(val==null?'':val)+'"'+(type==='email'?' autocapitalize="off" autocorrect="off"':'')+(type==='number'?' inputmode="decimal"':'')+'>'+(aide?'<div class="mu" style="margin-top:4px">'+aide+'</div>':'')}
function fiche(c){var n=!c;c=c||{id:'',entreprise:'',prenom:'',email:'',locationId:'',vfCompte:'',tva:10,acomptePourcent:30,options:{},menus:{},effectif:1,actif:true,secrets:null};
 var h='<div class="card"><h2>'+(n?'Nouveau client':esc(c.entreprise))+'</h2>'+(n?'<p class="mu" style="margin:0">Remplissez ce que vous avez. Tout se modifie ensuite.</p>':'<div>'+etat(c)+'</div>')+
  champ('fe','Nom de l\'entreprise',c.entreprise)+champ('fp','Prénom du contact',c.prenom)+'<label class="f" for="fact">Activité</label><input class="t" id="fact" list="acts" value="'+esc(c.activite||'')+'" placeholder="Ex. Plaquiste, Négoce de matériaux, Restaurant…"><datalist id="acts">'+['Artisan du bâtiment','Plaquiste','Menuisier','Plombier','Électricien','Peintre','Négoce de matériaux','Commerce','Restaurant','Beauté, bien-être','Services','Autre'].map(function(x){return '<option value="'+x+'">'}).join('')+'</datalist>'+champ('fm','E-mail du contact (sert à se connecter)',c.email,'email')+
  '<div class="row">'+'<div>'+champ('fl','Sous-compte GHL (identifiant)',c.locationId,'text','Paramètres du sous-compte › Infos entreprise › Location ID')+'</div><div>'+champ('fv','Compte VosFactures',c.vfCompte,'text','Ce qui est avant « .vosfactures.fr »')+'</div></div>'+
  '<div class="row"><div>'+champ('ft','TVA par défaut (%)',c.tva,'number')+'</div><div>'+champ('fa','Acompte par défaut (%)',c.acomptePourcent,'number')+'</div></div>'+
  '<label class="f" for="fn">Nombre de personnes dans l\'entreprise</label><input class="t" id="fn" type="number" inputmode="numeric" min="1" max="500" value="'+esc(c.effectif||'')+'" style="max-width:160px">'+
  '<div class="mu" style="margin-top:4px" id="fnh"></div>'+
  '<label class="f" for="fdj">Demandes du formulaire par jour, au plus</label><input class="t" id="fdj" type="number" inputmode="numeric" min="1" max="1000" placeholder="30" value="'+esc(c.demandesJour||'')+'" style="max-width:160px"><div class="mu" style="margin-top:4px">Protection contre les robots : au-delà, les demandes du jour sont refusées poliment. Vide = 30.</div>'+
  '<label class="f" for="fpr">Nom en haut de l\'Espace</label><select class="t" id="fpr" style="max-width:260px">'+[['','Automatique (activité, puis nombre de personnes)'],['archi','ARCHI'],['pro','PRO (seul)'],['team','TEAM (à plusieurs)']].map(function(o){return '<option value="'+o[0]+'"'+((c.profil||'')===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>'+
  '<label class="f">Menus de son Espace</label><div class="mu" style="margin-top:2px">Décochez ce qui ne lui sert pas : le menu disparaît de son Espace. L\'Accueil et les Réglages restent toujours.</div><div class="opts">'+(DATA.menus||Object.keys(MENUS)).map(function(k){return '<label class="sw">'+esc(MENUS[k]||k)+'<input type="checkbox" data-menu="'+k+'"'+(!c.menus||c.menus[k]!==false?' checked':'')+'></label>'}).join('')+'</div>'+

    (c.statut==='valide'?'':'<div class="row" style="margin-top:10px"><button class="btn sm" type="button" data-ap="'+esc(c.id)+'" data-st="refuse">Refuser</button><button class="btn sm go" type="button" data-ap="'+esc(c.id)+'" data-st="valide"'+(c.ecarts&&c.ecarts.length?'':' disabled')+'>Valider : Cliky l\'apprend</button></div>')+'</div>'}).join('');

/* ---------- mise en service : toutes les étapes, dans l'ordre ---------- */
var BLOC_STYLE='<style>\nhtml,body{margin:0!important;padding:0!important;overflow:hidden!important;height:100%!important;overscroll-behavior:none}\n#ID{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;border:0;display:block;z-index:2147483647;background:#ECEEF2}\n</style>\n';
function blocEspace(){return BLOC_STYLE.replace('#ID','#pcespace')+'<iframe id="pcespace" title="Espace ProClik" allow="microphone; geolocation; camera; web-share; clipboard-write" src="https://proclik.github.io/espace-depart/?v=2"></iframe>'}
function blocDevis(c){return BLOC_STYLE.replace('#ID','#clikdevis')+'<iframe id="clikdevis" title="Demande de devis" allow="web-share; clipboard-write; microphone; fullscreen" allowfullscreen src="https://proclik.github.io/devis/?v=31#s=1&a='+encodeURIComponent(c.id)+'&n='+encodeURIComponent(c.entreprise||'')+'&pr='+encodeURIComponent(c.prenom||'')+'"></iframe>\n'+
 '<script>\n(function () {\n  var f = document.getElementById("clikdevis"), page = location.href.split("#")[0];\n  if (!f || !/^https?:/.test(page)) return;\n  var s = f.getAttribute("src"), i = s.indexOf("#");\n  var m = location.hash.match(/[#&]reprise=([A-Za-z0-9_-]+)/);\n  f.src = s.slice(0, i) + "&p=" + encodeURIComponent(page) + s.slice(i) + (m ? "&reprise=" + m[1] : "");\n  if (m && history.replaceState) history.replaceState(null, "", page);\n})();\n<\/script>'}
function etapes(c){var m=c.mes||{};return [
 {k:'fiche',t:'Fiche remplie',d:'Nom, prénom, e-mail et sous-compte GHL.',auto:!!(c.entreprise&&c.email&&c.locationId)},
 {k:'ghl',t:'Clé GHL posée dans Cloudflare',d:'Clé privée du sous-compte (Paramètres › Clés privées), nommée '+c.secrets.ghl.nom+'.',auto:c.secrets.ghl.pose},
 {k:'vf',t:'VosFactures branché',d:'Nom du compte rempli + clé posée, nommée '+c.secrets.vf.nom+'.',auto:!!(c.vfCompte&&c.secrets.vf.pose)},
 {k:'snapshot',t:'Snapshot GHL poussé',d:'Pipelines « Devis & Chantiers », tags et workflows ProClik dans son sous-compte.'},
 {k:'pagedevis',t:'Page Devis dans son GHL',d:'Bouton ci-dessous : copiez le bloc et collez-le dans la page. Les demandes arrivent directement chez ProClik (plus de Make).',bloc:'devis'},
 {k:'pageespace',t:'Page Espace dans son GHL',d:'Bouton ci-dessous : bloc à coller dans la page (le même pour tous).',bloc:'espace'},
 {k:'acces',t:'Accès donné au client',d:'Lien d\'invitation ou code provisoire (carte « Accès » plus haut).',auto:c.acces!=='pas encore d\'accès'},
 {k:'test',t:'Test de bout en bout',d:'Une demande d\'essai : alerte reçue, pré-devis visible dans son Espace.'}
].map(function(e){e.fait=e.auto!==undefined?e.auto:!!m[e.k];return e})}
function miseEnService(c){var E=etapes(c),f=E.filter(function(e){return e.fait}).length;
 return '<div class="card"><h2>Mise en service <span class="pill '+(f===E.length?'ok':'w')+'">'+f+' / '+E.length+'</span></h2><p class="mu" style="margin:0 0 6px">Toutes les étapes pour qu\'il soit opérationnel. Celles marquées « auto » se cochent toutes seules.</p>'+
  E.map(function(e,i){return '<div class="mes"><label class="mes-l"><input type="checkbox" data-mes="'+e.k+'"'+(e.fait?' checked':'')+(e.auto!==undefined?' disabled':'')+'><span><b>'+(i+1)+'. '+esc(e.t)+'</b>'+(e.auto!==undefined?' <span class="pill">auto</span>':'')+'<br><span class="mu">'+esc(e.d)+'</span></span></label>'+
   (e.bloc?'<div class="row" style="margin:6px 0 0 34px"><button class="btn sm" type="button" data-bloc="'+e.bloc+'">Copier le bloc code</button></div>':'')+'</div>'}).join('')+'</div>'}
function brancheMes(c){
 [].forEach.call(document.querySelectorAll('[data-mes]'),function(x){if(x.disabled)return;x.addEventListener('change',function(){var m=Object.assign({},c.mes||{});m[x.dataset.mes]=x.checked;
  api('/admin/client',{method:'POST',body:{id:c.id,mes:m}}).then(function(){toast(x.checked?'Étape cochée':'Étape décochée');return charger()},function(e){x.checked=!x.checked;toast(e.message)})})});
 [].forEach.call(document.querySelectorAll('[data-bloc]'),function(b){b.addEventListener('click',function(){copier(b.dataset.bloc==='devis'?blocDevis(c):blocEspace())})});
}

var ETQ={recue:['Reçue','w'],en_cours:['En cours','w'],a_reessayer:['Nouvel essai bientôt','w'],fini:['Pré-devis fait','ok'],limite:['Limite de 3 demandes','w'],erreur:['En échec','al']};
function demandesForm(id){var D=$('#fdem');if(!D)return;

 },function(e){D.innerHTML='<h2>Demandes du formulaire</h2><div class="err">'+esc(e.message)+'</div>'})}
/* ---------- sur mesure : ce qui n'existe pas encore, pour ce client seulement ---------- */
var ETATS={demande:'Demandé',"en cours":'En cours',pret:'Prêt'};
function surMesure(c){var L=c.surmesure||[];
 return '<div class="card"><h2>Sur mesure</h2><p class="mu" style="margin:0">Une fonction spéciale pour ce client seulement. Notez la demande ; quand elle est construite (« Prêt »), l\'interrupteur l\'allume dans son Espace.</p><div id="smL">'+
  L.map(function(x,i){return '<div class="sm" data-i="'+i+'"><div class="row"><input class="t" data-k="titre" value="'+esc(x.titre)+'" placeholder="Ex. Bons de livraison négoce" aria-label="Titre"><select class="t" data-k="etat" style="flex:0 0 130px" aria-label="État">'+Object.keys(ETATS).map(function(k){return '<option value="'+k+'"'+(x.etat===k?' selected':'')+'>'+ETATS[k]+'</option>'}).join('')+'</select></div>'+
   '<textarea class="t" data-k="note" rows="2" placeholder="Ce qu\'il veut, en quelques mots" aria-label="Note" style="margin-top:6px;resize:vertical">'+esc(x.note)+'</textarea>'+
   '<div class="row" style="margin-top:6px"><label class="sw" style="flex:1 1 auto">Allumé dans son Espace<input type="checkbox" data-k="actif"'+(x.actif?' checked':'')+(x.etat!=='pret'?' disabled':'')+'></label><button class="btn sm al" type="button" data-smx style="flex:0 0 auto">Retirer</button></div></div>'}).join('')+'</div>'+
  '<div class="row" style="margin-top:10px"><button class="btn sm" type="button" id="smAdd">+ Ajouter une demande spéciale</button><button class="btn sm go" type="button" id="smSave">Enregistrer</button></div></div>'}
function brancheSm(c){var L=JSON.parse(JSON.stringify(c.surmesure||[]));
 function lire(){[].forEach.call(document.querySelectorAll('#smL .sm'),function(el){var x=L[+el.dataset.i];[].forEach.call(el.querySelectorAll('[data-k]'),function(f){x[f.dataset.k]=f.type==='checkbox'?f.checked:f.value})})}
 $('#smAdd').addEventListener('click',function(){lire();L.push({titre:'',note:'',etat:'demande',actif:false});var tmp=Object.assign({},c,{surmesure:L});var div=document.createElement('div');div.innerHTML=surMesure(tmp);var old=$('#smL').closest('.card');old.parentNode.replaceChild(div.firstChild,old);brancheSm(tmp)});
 [].forEach.call(document.querySelectorAll('[data-smx]'),function(b){b.addEventListener('click',function(){lire();L.splice(+b.closest('.sm').dataset.i,1);var tmp=Object.assign({},c,{surmesure:L});var div=document.createElement('div');div.innerHTML=surMesure(tmp);var old=$('#smL').closest('.card');old.parentNode.replaceChild(div.firstChild,old);brancheSm(tmp)})});
 [].forEach.call(document.querySelectorAll('#smL [data-k=etat]'),function(sel){sel.addEventListener('change',function(){var a=sel.closest('.sm').querySelector('[data-k=actif]');a.disabled=sel.value!=='pret';if(a.disabled)a.checked=false})});
 $('#smSave').addEventListener('click',function(){var b=this;lire();b.disabled=true;api('/admin/client',{method:'POST',body:{id:c.id,surmesure:L.filter(function(x){return x.titre.trim()})}}).then(function(){toast('Enregistré');return charger()},function(e){toast(e.message)}).then(function(){b.disabled=false})});
}

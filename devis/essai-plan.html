.bc-ic{font-size:40px;line-height:1}.bc-in h2{margin:0;font-size:21px;font-weight:800}.bc-in p{margin:0;color:var(--muted);font-size:15px}

<script>
const PT=[["entree","Entrée",[[1.8,1.4],[2.5,1.8],[3.5,2.2]]],["sejour","Séjour"],["cuisine","Cuisine"],["couloir","Couloir"],["chambre","Chambre"],["sdb","Salle de bain"],["wc","WC"],["bureau","Bureau"],["buanderie","Buanderie"],["garage","Garage"]];
const PCOL={sejour:"#EAD6B5",cuisine:"#D3E5EF",chambre:"#E6DAF2",sdb:"#C9EDE4",wc:"#D9EFE8",entree:"#F2E4D0",couloir:"#ECE5DA",bureau:"#DDE5F4",buanderie:"#D4ECEF",garage:"#E0E0E0"};
const TN=Object.fromEntries(PT.map(p=>[p[0],p[1]]));
// Ouvertures proposées selon la pièce (demandes de Cyril)
const OPS={entree:[["pe","Porte d'entrée",1],["fen","Fenêtre",0]],garage:[["fen","Fenêtre",0],["ps","Porte de service",0],["pg","Porte de garage",1]],wc:[["fen","Fenêtre",0]],couloir:[["fen","Fenêtre",0]],_:[["fen","Fenêtre",1],["pf","Porte-fenêtre",0],["baie","Baie vitrée",0]]};
const OPDEF={sejour:{fen:1,baie:1},sdb:{fen:1},cuisine:{fen:1},chambre:{fen:1},bureau:{fen:1},buanderie:{fen:1}};
// Tailles « Standard » : celles que le plan pose déjà d'office (newOp de devis/plan.html et OPT porteExt) ; baie sans cote d'office
const STD={fen:[120,135],pf:[140,215],pe:[90,215],ps:[90,215],pg:[240,200],baie:null,pi:[83,204]};
const ONE={fen:"la fenêtre",pf:"la porte-fenêtre",baie:"la baie vitrée",pe:"la porte d'entrée",ps:"la porte de service",pg:"la porte de garage",pi:"la porte de la pièce"};
const MANY={fen:"les fenêtres",pf:"les portes-fenêtres",baie:"les baies vitrées"};
const MODELS=[{k:"T2",d:"1 chambre",r:["entree","sejour","cuisine","chambre","sdb","wc"]},{k:"T3",d:"2 chambres",r:["entree","sejour","cuisine","couloir","chambre","chambre","sdb","wc"]},{k:"T4",d:"3 chambres",r:["entree","sejour","cuisine","couloir","chambre","chambre","chambre","sdb","wc"]},{k:"T5",d:"4 chambres",r:["entree","sejour","cuisine","couloir","chambre","chambre","chambre","chambre","sdb","wc"]}];
const NIVS=[["Plain-pied","Tout au rez-de-chaussée",["Rez-de-chaussée"]],["Avec un étage","Rez-de-chaussée + étage",["Rez-de-chaussée","Étage"]],["Combles aménagés","Rez-de-chaussée + combles",["Rez-de-chaussée","Combles"]],["Étage et combles","Rez-de-chaussée + étage + combles",["Rez-de-chaussée","Étage","Combles"]]];
const ETAT=["À garder","À changer","À créer"];
// Essai : petit formulaire au style du formulaire Clik'Devis (mêmes cartes, galets, compteurs), puis le plan d'origine guidé pièce par pièce.
let S={model:null,niv:null,rooms:[],H:2.5,k:0},uid=0;
const $=id=>document.getElementById(id),fr=v=>(Math.round(v*100)/100).toFixed(2).replace(".",",");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LVN=()=>NIVS[S.niv??0][2],ops=t=>OPS[t]||OPS._;
function mk(t){const r={id:++uid,t,n:TN[t],lv:0,op:{}};ops(t).forEach(([k,,d])=>r.op[k]=(OPDEF[t]||{})[k]??d);return r}
function renum(){const c={};S.rooms.forEach(r=>{const tot=S.rooms.filter(x=>x.t===r.t).length;c[r.t]=(c[r.t]||0)+1;r.n=TN[r.t]+(tot>1?" "+c[r.t]:"")})}
function defLv(){const n=LVN().length,ch=S.rooms.filter(x=>x.t==="chambre");S.rooms.forEach(r=>{if(r.lvSet&&r.lv<n)return;r.lv=n>1&&["chambre","bureau"].includes(r.t)?1:0;if(n>2&&(r.t==="bureau"||r.t==="chambre"&&ch.length>1&&ch.indexOf(r)===ch.length-1))r.lv=2;if(n>1&&r.t==="sdb"&&S.rooms.filter(x=>x.t==="sdb").indexOf(r)===1)r.lv=1})}
const pic=t=>`<span class="pic" style="background:${PCOL[t]}"></span>`;
const IC={
 log:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 22 24 9l16 13"/><path d="M12 19v20h24V19"/><path d="M21 39V29h6v10" stroke="#A8823F"/></svg>`,
 niv:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 38h28"/><path d="M14 38V24h20v14"/><path d="M14 24 24 15l10 9"/><path d="M19 31h10" stroke="#A8823F"/></svg>`,
 me:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="11" width="30" height="26" rx="4"/><path d="M24 11v14h15" stroke="#A8823F"/></svg>`};
// =============== Les questions ===============
function seq(){const a=[["model"],["niv"],["rooms"]];if(LVN().length>1)a.push(["lv"]);a.push(["haut"]);S.rooms.forEach((r,i)=>a.push(["open",i]));a.push(["go"]);return a}
function scr(){const[k,i]=seq()[S.k],r=S.rooms[i];
 if(k==="model")return{h:"Votre logement ressemble à…",sub:"Un seul toucher suffit. Vous pourrez ajouter ou retirer une pièce juste après.",ok:S.model!=null,b:`<div class="cards">${MODELS.map((m,j)=>`<button type="button" class="card" data-model="${j}" aria-pressed="${S.model===j}">${IC.log}<b>${m.k}</b><span>${m.d}</span></button>`).join("")}<button type="button" class="card" data-model="-1" aria-pressed="${S.model===-1}">${IC.me}<b>Je choisis moi-même</b><span>Pièce par pièce</span></button></div>`};
 if(k==="niv")return{h:"Combien de niveaux ?",sub:"On compte seulement ce qui est habitable.",ok:S.niv!=null,b:`<div class="cards">${NIVS.map(([t,d],j)=>`<button type="button" class="card" data-niv="${j}" aria-pressed="${S.niv===j}">${IC.niv}<b>${t}</b><span>${d}</span></button>`).join("")}</div>`};
 if(k==="rooms")return{h:"Quelles pièces y a-t-il ?",sub:"Mettez toutes les pièces, même sans travaux : le plan sera plus juste.",ok:S.rooms.length>0,b:`<div class="ptiles">${PT.map(([t,n])=>{const c=S.rooms.filter(x=>x.t===t).length;return`<div class="ptile${c?" on":""}">${pic(t)}<b>${n}</b><div class="pcnt"><button type="button" data-cnt="${t}|-1" aria-label="Retirer : ${n}">−</button><output>${c}</output><button type="button" class="plus" data-cnt="${t}|1" aria-label="Ajouter : ${n}">+</button></div></div>`}).join("")}</div>`};
 if(k==="lv")return{h:"À quel niveau est chaque pièce ?",sub:"On a mis les chambres en haut. Corrigez seulement ce qui ne va pas.",ok:true,b:S.rooms.map((x,j)=>`<div class="q"><span class="lab">${pic(x.t)} ${esc(x.n)}</span><div class="chips">${LVN().map((nm,lv)=>`<button type="button" class="chip" data-lv="${j}|${lv}" aria-pressed="${x.lv===lv}">${nm}</button>`).join("")}</div></div>`).join("")};
 if(k==="haut")return{h:"Quelle hauteur sous plafond ?",sub:"La même partout, le plus souvent. 2,50 m est la plus courante.",ok:true,b:`<div class="q"><span class="lab">Hauteur sous plafond</span><div class="chips">${[2.4,2.5,2.6,2.7,2.8,3].map(v=>`<button type="button" class="chip" data-h="${v}" aria-pressed="${S.H===v}">${fr(v)} m</button>`).join("")}</div></div>`};
 if(k==="open")return{h:`${r.n} : combien d'ouvertures ?`,sub:`Comptez ce qui donne dehors. On les placera sur le plan juste après.${LVN().length>1?` (${LVN()[r.lv]})`:""}`,ok:true,b:`<div class="ptiles">${ops(r.t).map(([kk,nm])=>`<div class="ptile${r.op[kk]?" on":""}"><b>${nm}</b><div class="pcnt"><button type="button" data-on="${i}|${kk}|-1" aria-label="Moins">−</button><output>${r.op[kk]}</output><button type="button" class="plus" data-on="${i}|${kk}|1" aria-label="Plus">+</button></div></div>`).join("")}</div>`};
 if(k==="go"){const n=S.rooms.length,o=S.rooms.reduce((s,r)=>s+Object.values(r.op).reduce((a,b)=>a+b,0),0);return{h:"Tout est prêt pour votre plan",sub:"On va tracer vos pièces une par une, puis toucher les murs où sont les fenêtres. On vous guide à chaque fois.",ok:true,go:"Tracer mon plan",b:`<div class="q"><span class="lab">Pièces à tracer : ${n}</span><span class="lab">Ouvertures à placer : ${o}</span>${LVN().length>1?`<span class="lab">Niveaux : ${LVN().length}</span>`:""}<span class="lab">Hauteur sous plafond : ${fr(S.H)} m</span></div>`}}}
function render(){const Q=seq();if(S.k>=Q.length)S.k=Q.length-1;const c=scr();
 $("prog").hidden=false;$("bar").style.width=Math.round((S.k+1)/Q.length*100)+"%";$("stepn").textContent=`Étape ${S.k+1} sur ${Q.length}`;
 $("app").innerHTML=`<section class="fade"><h1>${esc(c.h)}</h1><p class="sub">${esc(c.sub)}</p>${c.b}</section>`;
 $("nav").hidden=false;$("back").disabled=S.k===0;$("go").textContent=c.go||"Continuer";$("go").disabled=!c.ok}
$("app").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.model!=null){S.model=+d.model;if(S.model>=0){S.rooms=[];MODELS[S.model].r.forEach(t=>S.rooms.push(mk(t)));renum();defLv()}}
 else if(d.niv!=null){S.niv=+d.niv;defLv()}
 else if(d.cnt){const[t,v]=d.cnt.split("|");if(+v>0){const ord=PT.map(p=>p[0]),r=mk(t);let at=0;S.rooms.forEach((x,j)=>{if(ord.indexOf(x.t)<=ord.indexOf(t))at=j+1});S.rooms.splice(at,0,r)}else{const j=S.rooms.map(r=>r.t).lastIndexOf(t);if(j>=0)S.rooms.splice(j,1)}renum();defLv()}
 else if(d.lv){const[j,lv]=d.lv.split("|").map(Number);S.rooms[j].lv=lv;S.rooms[j].lvSet=true}
 else if(d.h){S.H=+d.h}
 else if(d.on){const[j,kk,v]=d.on.split("|");const r=S.rooms[+j];r.op[kk]=Math.max(0,Math.min(6,r.op[kk]+ +v))}
 else return;const y=scrollY;render();scrollTo(0,y)});
$("go").onclick=()=>{if(seq()[S.k][0]==="go"){startPlan();return}S.k++;render();scrollTo(0,0)};
$("back").onclick=()=>{if(S.k>0){S.k--;render();scrollTo(0,0)}};
// =============== Le plan d'origine, guidé pièce par pièce ===============
function startPlan(){const d={niv:LVN(),H:S.H,rooms:S.rooms.map(r=>({n:r.n,t:r.t,lv:r.lv,op:r.op}))};
 $("pframe").src="plan.html?client&embed&guide&v="+Date.now()+"#pg="+encodeURIComponent(JSON.stringify(d));$("planfull").hidden=false}
function closePlan(){$("planfull").hidden=true;$("pframe").src="about:blank"}
$("pf-done").onclick=()=>{closePlan();$("nav").hidden=true;$("prog").hidden=true;$("app").innerHTML=`<section class="done fade"><div class="ok">✓</div><h1>Merci, votre plan est fait !</h1><p class="sub">C'était un essai : rien n'a été envoyé.</p><button type="button" class="btn go" onclick="location.reload()">Recommencer l'essai</button></section>`};
addEventListener("message",e=>{if(e.data&&e.data.type==="pg-back")closePlan()});
render();
</script>

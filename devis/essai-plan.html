<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Essai plan guidé · ProClik</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Questions à toucher seules à l'écran ; le plan reste caché et se construit en coulisse, puis se révèle à la fin du questionnaire. */
:root{--bg:#ECEEF2;--surf:#F6F7F9;--fg:#141A2B;--mut:#5E6577;--line:#D6DAE2;--wall:#353C4E;--clo:#C9955B;--win:#5B9BD5;--acc:#A8823F;--accs:#F3EADB;--ink:#1B2440;--hi:#FFFFFF;--lo:#C9CED8;--lab:#0B1226;--f:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1424;--surf:#1B2238;--fg:#EEF0F5;--mut:#9AA2B8;--line:#2C3552;--wall:#C9CEDA;--clo:#D4B483;--win:#7FB6E8;--acc:#D4B483;--accs:#2E2A22;--ink:#F2EEE4;--hi:#26304C;--lo:#080B15;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1424;--surf:#1B2238;--fg:#EEF0F5;--mut:#9AA2B8;--line:#2C3552;--wall:#C9CEDA;--clo:#D4B483;--win:#7FB6E8;--acc:#D4B483;--accs:#2E2A22;--ink:#F2EEE4;--hi:#26304C;--lo:#080B15;color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:600 15.5px/1.4 var(--f);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.q{flex:1;min-height:0}
.pv{flex:none}
.top{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.dots{display:flex;gap:5px;flex:1}
.dots i{height:5px;flex:1;border-radius:9px;background:var(--line);transition:background .3s}
.dots i.on{background:var(--acc)}
.back{border:0;background:var(--surf);width:38px;height:38px;border-radius:50%;box-shadow:-2px -2px 5px var(--hi),2px 2px 6px var(--lo);font-weight:800;flex:none}
.back:disabled{opacity:.3}
.ex{font-size:11.5px;font-weight:800;color:var(--mut);background:var(--surf);border-radius:999px;padding:3px 9px}
.pv{margin:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--surf);border-radius:20px;box-shadow:inset 2px 2px 6px var(--lo),inset -2px -2px 6px var(--hi);height:min(46vh,420px);position:relative;overflow:hidden}
.reveal .rm{animation:rin .5s ease-out both}
.reveal .wl{stroke-dasharray:40;stroke-dashoffset:40;animation:wdraw 1.4s ease-out .9s forwards}
.reveal .ot{opacity:0;animation:fin .5s ease-out 2.1s forwards}
@keyframes rin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes wdraw{to{stroke-dashoffset:0}}
@keyframes fin{to{opacity:1}}
.rm{transform-box:fill-box;transform-origin:center}
.lays .lay{text-align:left;padding:12px 14px}
.lay small{color:var(--mut);font-weight:600;font-size:13px}
.busy{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;font-weight:700}
.busy i{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:fin 1s ease-in-out infinite alternate}
.pv svg{width:100%;height:100%;display:block}
.pv .cap{position:absolute;left:10px;bottom:8px;font-size:12px;font-weight:800;color:var(--mut);background:var(--surf);border-radius:999px;padding:2px 8px}
.pv .new{position:absolute;right:10px;top:8px;font-size:12.5px;font-weight:800;color:#fff;background:var(--acc);border-radius:999px;padding:3px 10px;opacity:0;transform:translateY(-6px);transition:.3s}
.pv .new.on{opacity:1;transform:none}
.pv .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-weight:700;text-align:center;padding:16px}
.q{overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;align-content:start}
h1{margin:2px 0 0;font-size:23px;line-height:1.2;font-weight:800;text-wrap:balance}
.sub{margin:0;color:var(--mut);font-size:14.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{border:0;background:var(--surf);border-radius:18px;padding:12px;display:grid;gap:6px;box-shadow:-3px -3px 7px var(--hi),3px 3px 8px var(--lo);text-align:left;position:relative}
.tile b{font-size:15.5px}
.tile small{color:var(--mut);font-size:12.5px;font-weight:600}
.tile[aria-pressed="true"]{box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi),0 0 0 2px var(--acc)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:13px;display:grid;place-items:center;font-weight:800}
.tile .sw{width:28px;height:20px;border-radius:6px}
.cnt{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cnt button{border:0;width:36px;height:36px;border-radius:50%;background:var(--bg);font-size:20px;font-weight:800;box-shadow:-2px -2px 5px var(--hi),2px 2px 6px var(--lo)}
.cnt button.p{background:var(--acc);color:#fff}
.cnt output{font-size:19px;font-weight:800;min-width:22px;text-align:center}
.tile.on{box-shadow:inset 0 0 0 2px var(--acc),-3px -3px 7px var(--hi),3px 3px 8px var(--lo)}
.rows{display:grid;gap:10px}
.row{background:var(--surf);border-radius:18px;padding:10px 12px;display:grid;gap:8px;box-shadow:-3px -3px 7px var(--hi),3px 3px 8px var(--lo)}
.row .h{display:flex;align-items:center;gap:8px}
.row .h .sw{width:16px;height:16px;border-radius:5px;flex:none}
.row .h b{flex:1;min-width:0}
.row .h small{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:0;border-radius:999px;padding:9px 14px;font-weight:800;font-size:14px;background:var(--bg);box-shadow:-2px -2px 5px var(--hi),2px 2px 6px var(--lo)}
.chip[aria-pressed="true"]{background:var(--acc);color:#fff;box-shadow:none}
.chip.dk{color:var(--mut)}
.chip.dk[aria-pressed="true"]{color:#fff}
.mes{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.st{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:14px;padding:3px}
.st button{border:0;width:34px;height:34px;border-radius:10px;background:var(--surf);font-weight:800;font-size:18px}
.st span{min-width:58px;text-align:center;font-weight:800}
.wn{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wn span{font-size:14px;color:var(--mut);font-weight:700}
.note{margin:0;background:var(--accs);color:var(--fg);border-radius:14px;padding:10px 12px;font-size:14px}
.lays{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lay{border:0;background:var(--surf);border-radius:18px;padding:8px;display:grid;gap:4px;box-shadow:-3px -3px 7px var(--hi),3px 3px 8px var(--lo)}
.lay svg{width:100%;height:110px}
.lay b{font-size:14px}
.lay[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--acc),-3px -3px 7px var(--hi),3px 3px 8px var(--lo)}
.done{display:grid;gap:8px;background:var(--surf);border-radius:18px;padding:14px;box-shadow:-3px -3px 7px var(--hi),3px 3px 8px var(--lo)}
.done div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.done div span{color:var(--mut)}
.foot{padding:8px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px}
.go{flex:1;border:0;border-radius:18px;padding:15px;font-weight:800;font-size:16.5px;background:var(--acc);color:#fff;animation:onde 1.8s ease-out infinite}
.go:disabled{opacity:.45;animation:none}
.skip{border:0;background:transparent;color:var(--mut);font-weight:800;padding:0 8px}
@keyframes onde{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 60%,transparent)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.rm{transition:opacity .4s}
.lbl{font:800 .34px var(--f);fill:var(--lab);text-anchor:middle}
.dim{font:600 .26px var(--f);fill:#3A4357;text-anchor:middle}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.m2{font-size:15px;font-weight:800;color:var(--acc);background:var(--accs);border-radius:10px;padding:3px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .h small{font-size:13.5px}
.sec{font-size:12.5px;font-weight:800;color:var(--acc);letter-spacing:.05em;text-transform:uppercase;margin:0}
.big{font-size:26px}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto auto;gap:8px;max-width:340px;margin:4px auto 0;width:100%}
.cmp button{border:0;border-radius:16px;padding:12px 6px;font-weight:800;font-size:14px;background:var(--surf);box-shadow:-3px -3px 7px var(--hi),3px 3px 8px var(--lo);display:grid;gap:2px;justify-items:center}
.cmp button i{font-style:normal;font-size:20px;color:var(--acc)}
.cmp button[aria-pressed="true"]{background:var(--acc);color:#fff;box-shadow:none}
.cmp button[aria-pressed="true"] i{color:#fff}
.cmp .ref{grid-column:2;grid-row:2;border-radius:14px;display:grid;place-items:center;text-align:center;font-weight:800;font-size:13.5px;color:var(--lab);padding:8px;min-height:64px}
.cmp .up{grid-column:2;grid-row:1}.cmp .lf{grid-column:1;grid-row:2}.cmp .rt{grid-column:3;grid-row:2}.cmp .dn{grid-column:2;grid-row:3}
.rue{text-align:center;color:var(--mut);font-size:12.5px;font-weight:800;margin:0}
.op{display:grid;gap:8px}
.op .wn b{font-size:15px}
.sides{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sides span{font-size:13px;color:var(--mut);font-weight:700}
.sides .chip{padding:7px 11px;font-size:13px}
.ptag{font-size:12px;font-weight:800;color:var(--mut)}
.dpw{background:var(--surf);border-radius:20px;box-shadow:inset 2px 2px 6px var(--lo),inset -2px -2px 6px var(--hi);height:min(52vh,440px);overflow:hidden}
.dpw svg{width:100%;height:100%;display:block}
.dpul{animation:dpul 1.6s ease-in-out infinite}
@keyframes dpul{50%{stroke-width:.24}}
</style>

<div class="app" id="app">
 <div class="top"><button type="button" class="back" id="back" aria-label="Revenir">←</button><div class="dots" id="dots"></div><span class="ex">Essai</span></div>
 <div class="q" id="q"></div>
 <div class="foot" id="foot"><button type="button" class="skip" id="skip">Je ne sais pas</button><button type="button" class="go" id="go">Continuer</button></div>
</div>
<iframe id="pl" hidden title="Votre plan" allow="microphone" style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:50;background:var(--bg)"></iframe>
<div class="toast2" id="toast"></div>

<script>
const PT=[["entree","Entrée",[[1.8,1.4],[2.5,1.8],[3.5,2.2]]],["sejour","Séjour"],["cuisine","Cuisine"],["couloir","Couloir"],["chambre","Chambre"],["sdb","Salle de bain"],["wc","WC"],["bureau","Bureau"],["buanderie","Buanderie"],["garage","Garage"]];
const PCOL={sejour:"#EAD6B5",cuisine:"#D3E5EF",chambre:"#E6DAF2",sdb:"#C9EDE4",wc:"#D9EFE8",entree:"#F2E4D0",couloir:"#ECE5DA",bureau:"#DDE5F4",buanderie:"#D4ECEF",garage:"#E0E0E0"};
const TN=Object.fromEntries(PT.map(p=>[p[0],p[1]]));
// Ouvertures proposées selon la pièce (demandes de Cyril)
const OPS={entree:[["pe","Porte d'entrée",1],["fen","Fenêtre",0]],garage:[["fen","Fenêtre",0],["ps","Porte de service",0],["pg","Porte de garage",1]],wc:[["fen","Fenêtre",0]],couloir:[["fen","Fenêtre",0]],_:[["fen","Fenêtre",1],["pf","Porte-fenêtre",0],["baie","Baie vitrée",0]]};
const OPDEF={sejour:{fen:1,baie:1},sdb:{fen:1},cuisine:{fen:1},chambre:{fen:1},bureau:{fen:1},buanderie:{fen:1}};
// Tailles « Standard » : celles que le plan pose déjà d'office (newOp de devis/plan.html et OPT porteExt) ; baie sans cote d'office
const STD={fen:[120,135],pf:[140,215],pe:[90,215],ps:[90,215],pg:[240,200],baie:null,pi:[83,204]};
const ONE={fen:"la fenêtre",pf:"la porte-fenêtre",baie:"la baie vitrée",pe:"la porte d'entrée",ps:"la porte de service",pg:"la porte de garage",pi:"la porte de la pièce"};
const MANY={fen:"les fenêtres",pf:"les portes-fenêtres",baie:"les baies vitrées"};
const MODELS=[{k:"T2",d:"1 chambre",r:["entree","sejour","cuisine","chambre","sdb","wc"]},{k:"T3",d:"2 chambres",r:["entree","sejour","cuisine","couloir","chambre","chambre","sdb","wc"]},{k:"T4",d:"3 chambres",r:["entree","sejour","cuisine","couloir","chambre","chambre","chambre","sdb","wc"]},{k:"T5",d:"4 chambres",r:["entree","sejour","cuisine","couloir","chambre","chambre","chambre","chambre","sdb","wc"]}];
const NIVS=[["Plain-pied","Tout au rez-de-chaussée",["Rez-de-chaussée"]],["Avec un étage","Rez-de-chaussée + étage",["Rez-de-chaussée","Étage"]],["Combles aménagés","Rez-de-chaussée + combles",["Rez-de-chaussée","Combles"]],["Étage et combles","Rez-de-chaussée + étage + combles",["Rez-de-chaussée","Étage","Combles"]]];
const ETAT=["À garder","À changer","À créer"];
let S={model:null,niv:null,rooms:[],H:2.5,k:0},uid=0;
const $=id=>document.getElementById(id),fr=v=>(Math.round(v*100)/100).toFixed(2).replace(".",","),f1=v=>(Math.round(v*10)/10).toFixed(1).replace(".",",");
const LVN=()=>NIVS[S.niv??0][2],ops=t=>OPS[t]||OPS._;
function mk(t){const r={id:++uid,t,n:TN[t],lv:0,op:{}};ops(t).forEach(([k,,d])=>r.op[k]=(OPDEF[t]||{})[k]??d);return r}
function renum(){const c={};S.rooms.forEach(r=>{const tot=S.rooms.filter(x=>x.t===r.t).length;c[r.t]=(c[r.t]||0)+1;r.n=TN[r.t]+(tot>1?" "+c[r.t]:"")})}
function defLv(){const n=LVN().length,ch=S.rooms.filter(x=>x.t==="chambre");S.rooms.forEach(r=>{if(r.lvSet&&r.lv<n)return;r.lv=n>1&&["chambre","bureau"].includes(r.t)?1:0;if(n>2&&(r.t==="bureau"||r.t==="chambre"&&ch.length>1&&ch.indexOf(r)===ch.length-1))r.lv=2;if(n>1&&r.t==="sdb"&&S.rooms.filter(x=>x.t==="sdb").indexOf(r)===1)r.lv=1})}
const sw=r=>`<span class="sw" style="background:${PCOL[r.t]}"></span>`;
function art(r){const fem=["cuisine","chambre","sdb","entree","buanderie"].includes(r.t),v=/^[AEÉIOUY]/.test(r.n);return r.t==="wc"?"les WC":(v?"l'":fem?"la ":"le ")+r.n.charAt(0).toLowerCase()+r.n.slice(1)}

// =============== 1. Le petit formulaire : il prépare tout ===============
function seq(){const a=[["model"],["niv"],["rooms"]];if(LVN().length>1)a.push(["lv"]);a.push(["haut"]);S.rooms.forEach((r,i)=>a.push(["open",i]));a.push(["go"]);return a}
const SEC=["model","niv","rooms","haut","open","go"],SECOF={lv:"rooms"};
function scr(){const[k,i]=seq()[S.k],r=S.rooms[i];
 if(k==="model")return{h:"Votre logement ressemble à…",sub:"Un toucher suffit. Vous pourrez ajouter ou retirer une pièce juste après.",ok:S.model!=null,b:`<div class="grid">${MODELS.map((m,j)=>`<button type="button" class="tile" data-model="${j}" aria-pressed="${S.model===j}"><b>${m.k}</b><small>${m.d}</small></button>`).join("")}<button type="button" class="tile" data-model="-1" aria-pressed="${S.model===-1}"><b>Je choisis moi-même</b><small>Pièce par pièce</small></button></div>`};
 if(k==="niv")return{h:"Combien de niveaux ?",sub:"On compte seulement ce qui est habitable.",ok:S.niv!=null,b:`<div class="rows">${NIVS.map(([t,d],j)=>`<button type="button" class="tile" data-niv="${j}" aria-pressed="${S.niv===j}"><b>${t}</b><small>${d}</small></button>`).join("")}</div>`};
 if(k==="rooms")return{h:"Quelles pièces y a-t-il ?",sub:"Mettez toutes les pièces, même sans travaux : le plan sera plus juste.",ok:S.rooms.length>0,b:`<div class="grid">${PT.map(([t,n])=>{const c=S.rooms.filter(x=>x.t===t).length;return`<div class="tile${c?" on":""}"><span class="sw" style="background:${PCOL[t]}"></span><b>${n}</b><div class="cnt"><button type="button" data-cnt="${t}|-1" aria-label="Retirer ${n}">−</button><output>${c}</output><button type="button" class="p" data-cnt="${t}|1" aria-label="Ajouter ${n}">+</button></div></div>`}).join("")}</div>`};
 if(k==="lv")return{h:"À quel niveau est chaque pièce ?",sub:"On a mis les chambres en haut. Corrigez seulement ce qui ne va pas.",ok:true,skip:1,b:`<div class="rows">${S.rooms.map((x,j)=>`<div class="row"><div class="h">${sw(x)}<b>${x.n}</b></div><div class="chips">${LVN().map((nm,lv)=>`<button type="button" class="chip" data-lv="${j}|${lv}" aria-pressed="${x.lv===lv}">${nm}</button>`).join("")}</div></div>`).join("")}</div>`};
 if(k==="haut")return{h:"Quelle hauteur sous plafond ?",sub:"La même partout, le plus souvent. 2,50 m est la plus courante.",ok:true,skip:1,b:`<div class="chips">${[2.4,2.5,2.6,2.7,2.8,3].map(v=>`<button type="button" class="chip" data-h="${v}" aria-pressed="${S.H===v}">${fr(v)} m</button>`).join("")}</div>`};
 if(k==="open")return{h:`${r.n} : combien d'ouvertures ?`,sub:"Comptez ce qui donne dehors. On les placera sur le plan juste après.",ok:true,skip:1,sec:`Fenêtres et portes · ${i+1}/${S.rooms.length}`,b:`<div class="row"><div class="h">${sw(r)}<b>${r.n}</b>${LVN().length>1?`<span class="ptag">${LVN()[r.lv]}</span>`:""}</div>${ops(r.t).map(([kk,nm])=>`<div class="wn"><b>${nm}</b><div class="st"><button type="button" data-on="${i}|${kk}|-1" aria-label="Moins">−</button><span>${r.op[kk]}</span><button type="button" data-on="${i}|${kk}|1" aria-label="Plus">+</button></div></div>`).join("")}</div>`};
 if(k==="go"){const n=S.rooms.length,o=S.rooms.reduce((s,r)=>s+Object.values(r.op).reduce((a,b)=>a+b,0),0);return{h:"Tout est prêt pour votre plan",sub:"On va tracer vos pièces une par une, puis toucher les murs où sont les fenêtres. On vous guide à chaque fois.",ok:true,go:"Tracer mon plan",b:`<div class="done"><div><span>Pièces à tracer</span><b>${n}</b></div><div><span>Ouvertures à placer</span><b>${o}</b></div>${LVN().length>1?`<div><span>Niveaux</span><b>${LVN().length}</b></div>`:""}<div><span>Hauteur sous plafond</span><b>${fr(S.H)} m</b></div></div>`}}}
function render(){const Q=seq();if(S.k>=Q.length)S.k=Q.length-1;const c=scr(),[k]=Q[S.k];
 $("dots").innerHTML=SEC.map(x=>`<i class="${SEC.indexOf(x)<=SEC.indexOf(SECOF[k]||k)?"on":""}"></i>`).join("");
 $("q").innerHTML=`${c.sec?`<p class="sec">${c.sec}</p>`:""}<h1>${c.h}</h1><p class="sub">${c.sub}</p>${c.b}`;
 $("back").disabled=S.k===0;$("go").textContent=c.go||"Continuer";$("go").disabled=!c.ok;$("skip").hidden=!c.skip}
$("q").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.model!=null){S.model=+d.model;if(S.model>=0){S.rooms=[];MODELS[S.model].r.forEach(t=>S.rooms.push(mk(t)));renum();defLv()}}
 else if(d.niv!=null){S.niv=+d.niv;defLv()}
 else if(d.cnt){const[t,v]=d.cnt.split("|");if(+v>0){const ord=PT.map(p=>p[0]),r=mk(t);let at=0;S.rooms.forEach((x,j)=>{if(ord.indexOf(x.t)<=ord.indexOf(t))at=j+1});S.rooms.splice(at,0,r)}else{const j=S.rooms.map(r=>r.t).lastIndexOf(t);if(j>=0)S.rooms.splice(j,1)}renum();defLv()}
 else if(d.lv){const[j,lv]=d.lv.split("|").map(Number);S.rooms[j].lv=lv;S.rooms[j].lvSet=true}
 else if(d.h){S.H=+d.h}
 else if(d.on){const[j,kk,v]=d.on.split("|");const r=S.rooms[+j];r.op[kk]=Math.max(0,Math.min(6,r.op[kk]+ +v))}
 const y=$("q").scrollTop;render();$("q").scrollTop=y});
$("go").onclick=()=>{if(seq()[S.k][0]==="go"){startPlan();return}S.k++;render();$("q").scrollTop=0};
$("skip").onclick=()=>{S.k++;render();$("q").scrollTop=0};$("back").onclick=()=>{if(S.k>0){S.k--;render()}};

// =============== 2. Le VRAI plan ProClik, en mode guidé ===============
function startPlan(){const d={niv:LVN(),H:S.H,rooms:S.rooms.map(r=>({n:r.n,t:r.t,lv:r.lv,op:r.op}))};
 const f=$("pl");f.src="plan.html?client&embed&guide&v="+Date.now()+"#pg="+encodeURIComponent(JSON.stringify(d));f.hidden=false}
addEventListener("message",e=>{if(e.data&&e.data.type==="pg-back"){const f=$("pl");f.hidden=true;f.src="about:blank"}});
render();
</script>

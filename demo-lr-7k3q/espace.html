<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Espace Lauzière</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="demo.css">
<script src="demo.js"></script><script src="data.js"></script><script src="vraie-carte.js"></script>
<style>

body{min-height:100dvh}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  padding:max(10px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top .logo span{font-size:15px}.top .logo small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.top .sp{flex:1}
.roles{display:flex;gap:4px;background:var(--teinte);border-radius:99px;padding:4px;margin:0 auto 8px;width:calc(100% - 32px);max-width:520px}
.roles button{flex:1;padding:9px 6px;border-radius:99px;font-weight:700;font-size:13px;color:var(--muted);transition:background .25s,color .25s,box-shadow .25s}
.roles button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--nuit)}
.bandeau{margin:0 16px 6px;display:flex;justify-content:center}
main{padding:6px 16px 120px;max-width:760px;margin:0 auto}
h1{font-size:26px;letter-spacing:-.02em;margin:10px 0 2px}
h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sous{color:var(--muted);margin:0 0 16px;font-size:14px}
.pile{display:grid;gap:14px}
.ln{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;width:100%;text-align:left}
.ln+.ln{margin-top:8px}
.ln b{display:block;font-size:15px}.ln small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.ln .tx{flex:1;min-width:0}
.ln .fl{color:var(--muted)}
.pt{width:9px;height:9px;border-radius:50%;flex:none}
.pt.ok{background:var(--ok)}.pt.warn{background:var(--warn)}.pt.alert{background:var(--alert)}
.chif{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.chif div{background:var(--teinte);border-radius:16px;padding:12px 4px}
.chif b{display:block;font-size:24px;letter-spacing:-.02em}.chif small{font-size:12px;color:var(--muted);font-weight:600}
@media(max-width:420px){.chif{grid-template-columns:repeat(2,1fr)}}
.barre{height:8px;border-radius:99px;background:var(--teinte);overflow:hidden;margin-top:8px}
.barre i{display:block;height:100%;background:var(--nuit);border-radius:99px;transition:width .6s var(--doux)}
.etapes{display:flex;gap:4px;margin-top:10px}
.etapes i{flex:1;height:5px;border-radius:99px;background:var(--teinte)}
.etapes i.f{background:var(--nuit)}.etapes i.c{background:var(--laiton)}
.etq{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--teinte);color:var(--muted);white-space:nowrap}
.etq.alert{color:var(--alert);background:color-mix(in srgb,var(--alert) 12%,transparent)}
.etq.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.etq.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:10px 14px;border-radius:99px;font-weight:600;font-size:14px}
.chips button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--nuit);background:color-mix(in srgb,var(--nuit) 9%,var(--bg))}
.btn2{padding:11px 14px;border-radius:13px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.vide{color:var(--muted);font-size:14px;padding:6px 2px}
/* barre du bas (téléphone) / menu à gauche (grand écran) */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:30;display:flex;gap:4px;padding:6px;border-radius:26px;
  background:var(--calme);box-shadow:var(--calme-sh),0 0 0 1px var(--line);width:min(440px,calc(100% - 24px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:20px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.nav button .g{width:38px;height:30px;border-radius:14px;display:grid;place-items:center}
.nav button[aria-selected="true"]{color:var(--fg)}
.nav button[aria-selected="true"] .g{color:var(--nuit);box-shadow:0 0 0 2px var(--laiton);background:var(--bg)}
.nav .bd{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--alert);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
@media(min-width:900px){
  .nav{left:16px;top:120px;bottom:auto;transform:none;flex-direction:column;width:110px}
  main{padding-left:150px;max-width:930px}
}
/* planning des postes */
.post{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.qui{display:flex;align-items:center;gap:8px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--teinte);color:var(--nuit);flex:none}
.av.abs{opacity:.4}
/* Cliky */
.fil{display:grid;gap:10px;margin-bottom:12px}
.bu{max-width:88%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.4}
.bu.moi{justify-self:end;background:var(--nuit);color:var(--nuit-fg);border-bottom-right-radius:6px}
.bu.ck{background:var(--calme);box-shadow:var(--calme-sh);border-bottom-left-radius:6px}
.bu.ck b{color:var(--fg)}
.tape{display:inline-flex;gap:4px}.tape i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tp 1s infinite}.tape i:nth-child(2){animation-delay:.15s}.tape i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.25}50%{opacity:1}}
.saisie{display:flex;gap:8px;align-items:center;margin-top:8px}
.saisie .champ{flex:1;padding:13px 14px;border-radius:14px;background:var(--bg);box-shadow:var(--in);font-size:15px;color:var(--muted)}
/* fenêtre */
.voile{position:fixed;inset:0;background:rgba(10,14,26,.35);z-index:40;display:none;align-items:flex-end;justify-content:center}
.voile.on{display:flex}
.fen{background:var(--bg);width:min(560px,100%);border-radius:26px 26px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;animation:monte .35s var(--doux)}
@media(min-width:700px){.voile{align-items:center}.fen{border-radius:26px}}
.fen h3{margin:4px 0 6px;font-size:20px}
.fen .ferme{float:right;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.photo{height:120px;border-radius:16px;background:repeating-linear-gradient(135deg,var(--teinte) 0 10px,transparent 10px 20px);display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:13px}
.toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translate(-50%,-220%);opacity:0;z-index:60;background:var(--nuit);color:var(--nuit-fg);padding:12px 16px;border-radius:16px;font-weight:700;font-size:14px;
  display:flex;gap:10px;align-items:center;transition:transform .45s var(--doux);max-width:calc(100% - 32px);box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
.toast.on{transform:translate(-50%,0);opacity:1}
.grand{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.choix{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.choix button{padding:14px 10px;border-radius:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.choix button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--nuit);background:color-mix(in srgb,var(--nuit) 9%,var(--bg))}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal .h{color:var(--muted);font-weight:700;font-size:11px}
.cal button{aspect-ratio:1;border-radius:12px;font-weight:700}
.cal button.on{background:var(--nuit);color:var(--nuit-fg)}
.cal button.mid{background:color-mix(in srgb,var(--nuit) 14%,transparent)}
.cal button:disabled{opacity:.3}
.roles button{font-size:12.5px}
.ck-top{background:var(--nuit);color:var(--nuit-fg);border-radius:22px;padding:16px;display:flex;gap:12px}
.ck-top .ico{background:rgba(255,255,255,.12);color:var(--laiton)}
.ck-top p{margin:4px 0 0;font-size:14.5px;line-height:1.45;opacity:.92}
.ck-top b.t{font-size:13px;opacity:.8}
.grille{display:grid;grid-template-columns:72px repeat(5,1fr);gap:4px;font-size:12px}
.grille .h{font-weight:800;color:var(--muted);text-align:center;padding:4px 0}
.grille .n{font-weight:700;display:flex;align-items:center}
.grille .c{border-radius:10px;padding:8px 2px;text-align:center;font-weight:800;font-size:11px;background:var(--teinte);min-height:34px;display:grid;place-items:center}
.grille .c.rey{background:color-mix(in srgb,#3E6FB8 22%,transparent)}.grille .c.mey{background:color-mix(in srgb,#B8955A 30%,transparent)}
.grille .c.rev{background:color-mix(in srgb,#3E8E6A 24%,transparent)}.grille .c.cab{background:color-mix(in srgb,#8A5CB8 22%,transparent)}
.grille .c.hue{background:color-mix(in srgb,#C2577A 22%,transparent)}.grille .c.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.grille .c.neu{box-shadow:inset 0 0 0 2px var(--laiton)}
.acc{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:13px}
.acc th{font-size:11px;color:var(--muted);font-weight:800;padding:4px 2px}
.acc td{padding:8px 4px;background:var(--teinte);text-align:center;font-weight:700}
.acc td:first-child{text-align:left;border-radius:10px 0 0 10px;font-weight:700}.acc td:last-child{border-radius:0 10px 10px 0}
.acc .oui{color:var(--ok)}.acc .non{color:var(--muted);opacity:.6}.acc .part{color:var(--warn);font-size:11px}
.acc button{font-weight:800;padding:4px 6px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--laiton)}
.mt{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mt button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;text-align:left;font-weight:700;font-size:14px}
.mt button .cb{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--muted);display:grid;place-items:center;flex:none}
.mt button[aria-pressed="true"] .cb{background:var(--nuit);box-shadow:none;color:var(--nuit-fg)}
.mt button .cb svg{width:14px;height:14px}
.gros{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gros button{padding:16px 12px;border-radius:20px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;font-weight:800;font-size:15px;text-align:left;min-height:104px}
.gros button small{font-weight:600;color:var(--muted);font-size:12.5px}
.pointe{display:flex;align-items:center;gap:12px}
.task{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;width:100%;text-align:left;font-weight:700;font-size:14.5px}
.task+.task{margin-top:6px}
.task .cb{width:24px;height:24px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--muted);display:grid;place-items:center;flex:none}
.task.ok .cb{background:var(--ok);box-shadow:none;color:#fff}.task.ok span.t{text-decoration:line-through;color:var(--muted)}
.task .cb svg{width:15px;height:15px}
.task small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ph div{aspect-ratio:4/3;border-radius:12px;background:repeating-linear-gradient(135deg,var(--teinte) 0 8px,transparent 8px 16px);display:grid;place-items:center;color:var(--muted)}
.lot{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.lot:last-child{border:0}.lot b{white-space:nowrap}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:16px;padding-top:10px}
.sign{height:90px;border-radius:16px;background:var(--bg);box-shadow:var(--in);display:grid;place-items:center;color:var(--muted);font-size:14px;margin:10px 0}
.sign svg{width:200px;height:70px}
.sign path{stroke:var(--nuit);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:trace 1.4s ease forwards}
@keyframes trace{to{stroke-dashoffset:0}}
.verrou-t{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:600}
.verrou-t .ico{width:34px;height:34px}
.carte{position:relative;height:190px;border-radius:18px;background:var(--teinte);overflow:hidden}
.carte svg{width:100%;height:100%}
.pin{fill:var(--nuit)}.pin.al{fill:var(--alert)}
.carte text{font-size:10px;font-weight:700;fill:var(--muted)}
.carte .vl{font-size:11px;font-weight:800;fill:var(--fg)}
.semnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.rond2{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.pile>*{min-width:0}
.grille2{display:grid;grid-template-columns:78px repeat(5,minmax(0,1fr));gap:4px;font-size:12px}
.grille2 .h{font-weight:800;color:var(--muted);text-align:center;padding:4px 0;border-radius:10px;line-height:1.1}
.grille2 .h small{display:block;font-size:11px;font-weight:700}
.grille2 .h.auj{background:var(--nuit);color:var(--nuit-fg)}
.grille2 .n{display:flex;align-items:center;gap:5px;text-align:left;font-weight:700;font-size:12px;padding:2px 0;min-width:0}
.grille2 .n>span:last-child{min-width:0;overflow:hidden}
.grille2 .n .av{width:28px;height:28px;font-size:12px}.grille2 .n small{display:block;font-size:10px;color:var(--muted);font-weight:700}.grille2 .n small.ok{color:var(--ok)}
.grille2 .c{position:relative;border-radius:10px;padding:10px 1px;text-align:center;font-weight:800;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;background:var(--teinte);min-height:40px;transition:transform .15s}
.grille2 .c:active{transform:scale(.95)}
.grille2 .c .pt{position:absolute;top:4px;right:4px;width:7px;height:7px}
.grille2 .c.aujc{outline:2px solid color-mix(in srgb,var(--nuit) 35%,transparent);outline-offset:-2px}
.c.rey,.dotc.rey{background:#3E6FB8}.c.mey,.dotc.mey{background:#D9822B}
.c.rev,.dotc.rev{background:#3E8E6A}.c.cab,.dotc.cab{background:#8A5CB8}
.c.hue,.dotc.hue{background:#C2577A}
.c.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--alert);color:var(--alert)}.c.off2{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.c.neu{box-shadow:inset 0 0 0 2px var(--laiton)}
.dotc{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;flex:none}
.dotc.big{width:22px;height:22px;border-radius:7px;margin:0}
.dotc.off,.dotc.cg,.dotc.fo,.dotc.dp{box-shadow:inset 0 0 0 1.5px var(--muted)}
.jr{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;width:100%;text-align:left}
.jr+.jr{margin-top:6px}
.jr .jd{width:42px;flex:none;text-align:center}.jr .jd b{display:block;font-size:14px}.jr .jd small{color:var(--muted);font-size:12px;font-weight:700}
.jr .tx{flex:1;min-width:0}.jr .tx b{display:block;font-size:14.5px}.jr .tx small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.jr small svg{width:13px;height:13px;vertical-align:-2px}
.jr.aujr{box-shadow:inset 3px 0 0 var(--nuit);background:color-mix(in srgb,var(--nuit) 6%,transparent)}
.jr .av{width:30px;height:30px;font-size:12px;margin-right:-4px;box-shadow:0 0 0 2px var(--calme)}
.pa{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:8px;color:#fff;font-weight:800;font-size:13px;flex:none}
.pa.big{min-width:40px;height:40px;border-radius:13px;font-size:17px}
.pa.dvp{background:transparent;color:var(--laiton);box-shadow:inset 0 0 0 2px var(--laiton)}
.jours{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.jours button{padding:8px 0;border-radius:14px;background:var(--calme);box-shadow:var(--calme-sh);line-height:1.15}
.jours button b{display:block;font-size:14px}.jours button small{font-size:12px;color:var(--muted);font-weight:700}
.jours button.auj{box-shadow:var(--calme-sh),inset 0 -3px 0 var(--laiton)}
.jours button[aria-pressed="true"]{background:var(--nuit);color:var(--nuit-fg)}.jours button[aria-pressed="true"] small{color:inherit;opacity:.8}
.resume{margin:2px 2px 0;font-size:15px}
.chj{background:var(--calme);border-radius:20px;box-shadow:var(--calme-sh);overflow:hidden;border-left:8px solid var(--cc)}
.chj-h{display:flex;align-items:center;gap:12px;padding:14px 14px 8px;cursor:pointer}
.chj-h .tx{flex:1;min-width:0}.chj-h .tx b{display:block;font-size:16px}.chj-h .tx small{color:var(--muted);font-size:13px}
.chj-h .nb{text-align:center;line-height:1}.chj-h .nb b{display:block;font-size:30px;color:var(--cc);letter-spacing:-.02em}.chj-h .nb small{font-size:11px;color:var(--muted);font-weight:700}
.chj-p{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}
.pp{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:99px;background:var(--bg);box-shadow:var(--pk);font-weight:700;font-size:13.5px;position:relative}
.pp .av{width:26px;height:26px;font-size:11px}.pp .pt{width:8px;height:8px;margin-left:2px}
.pp.manque{color:var(--alert);box-shadow:inset 0 0 0 1.5px var(--alert);background:transparent;padding:6px 12px}.pp.manque svg{width:16px;height:16px}
.regl h2{font-size:15px}.regl .pt{width:10px;height:10px}
.rg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:14px;font-weight:700;font-size:13.5px}.rg+.rg{margin-top:6px}
.ckmini{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--teinte);font-size:13.5px}.ckmini>span:nth-child(2){flex:1}
.semg{display:grid;grid-template-columns:86px repeat(5,minmax(0,1fr));gap:5px}
.semg .h{text-align:center;font-weight:800;font-size:12px;color:var(--muted);line-height:1.1;padding:4px 0;border-radius:10px}.semg .h small{display:block;font-size:11px}
.semg .h.auj{background:var(--nuit);color:var(--nuit-fg)}
.semg .sn{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;min-width:0}.semg .sn span:last-child{overflow:hidden;text-overflow:ellipsis}
.sc{position:relative;border-radius:12px;background:var(--cc);color:#fff;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.sc b{font-size:20px}.sc small{font-size:9.5px;font-weight:700;opacity:.9;margin-top:3px}
.sc.vide{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.sc.court{box-shadow:0 0 0 2.5px var(--alert)}.sc i{position:absolute;top:-6px;right:-5px;background:var(--alert);color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:99px;padding:2px 5px}
.sc.abs{background:var(--teinte);color:var(--muted)}.sc.abs b{font-size:16px}
.eqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.eqp{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;text-align:left;flex-wrap:wrap}.eqp b{flex:1;font-size:14px}
.mini5{display:flex;gap:3px;width:100%}.mini5 i{flex:1;height:8px;border-radius:3px}
.map{width:100%;height:auto;display:block;border-radius:16px;background:color-mix(in srgb,var(--nuit) 4%,var(--calme))}
.map .riv{fill:none;stroke:color-mix(in srgb,#3E6FB8 35%,transparent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.map .riv.fine{stroke-width:2.5}

    return '<button class="jr pk'+(w===0&&d===0?' aujr':'')+'" onclick="caseP('+w+',\''+p+'\','+d+')"><span class="jd"><b>'+JOURS[d]+'</b><small>'+DATES[w][d]+'</small></span><span class="dotc '+(c||'off')+'"></span><span class="tx"><b>'+(C?C.n:nomCase(c))+'</b><small>'+(C?C.l+' · 8 h → 17 h':c?'Toute la journée':'Rien de prévu : touchez pour le placer')+'</small></span>'+(neu?'<span class="etq warn">Changé</span>':'')+'</button>'}).join('')+'</div>';
  var j=L.filter(function(c){return COUL[c]}).length;
  h+='<div class="chif" style="margin-top:12px"><div><b>'+j*8+' h</b><small>prévues</small></div><div><b>'+(w===0?'7 h 30':'—')+'</b><small>pointées</small></div><div><b>'+L.filter(function(c){return !c}).length+'</b><small>jour libre</small></div><div><b>'+(S.envoye?(S.vu[p]?'Oui':'Non'):'—')+'</b><small>a vu sa semaine</small></div></div></section>';
  h+='<button class="btn2 pk" onclick="semaineCopie(\''+p+'\','+w+')">'+ic('cal')+'Mettre '+p+' toute la semaine sur un chantier</button>';
  return h}
function vueCh(w){var ch=S.plv.ch,C=CH.filter(function(x){return x.id===ch})[0];
  var h='<div class="row chips" style="margin-bottom:2px">'+CH.map(function(x){return '<button class="pk" aria-pressed="'+(x.id===ch)+'" onclick="S.plv.ch=\''+x.id+'\';save();re()"><span class="dotc '+x.id+'"></span>'+CHN[x.id]+'</button>'}).join('')+'</div>';
  h+='<section class="blk monte"><b style="font-size:17px">'+C.n+'</b><p class="muted" style="margin:2px 0 8px;font-size:13px">'+C.l+' · '+DUR[ch]+'</p>';
  h+=[0,1,2,3,4].map(function(d){var qui=EQUIPE.filter(function(p){return S.pl[w][p][d]===ch}),b=BES[ch][w][d],m=b-qui.length,lv=(LIV[ch]||[]).filter(function(l){return l[0]===w&&l[1]===d})[0];
    return '<div class="jr'+(w===0&&d===0?' aujr':'')+'" style="cursor:default"><span class="jd"><b>'+JOURS[d]+'</b><small>'+DATES[w][d]+'</small></span><span class="tx"><span class="qui">'+(qui.length?qui.map(function(p){return '<span class="av" title="'+p+'">'+p[0]+'</span>'}).join(''):'<small class="muted">Personne</small>')+'</span>'+(lv?'<small style="color:var(--laiton);font-weight:700">'+ic('truck')+' Livraison : '+lv[2]+'</small>':'')+'</span>'+
      (m>0?'<button class="btn2 pk" style="color:var(--alert)" onclick="ajoutCh('+w+',\''+ch+'\','+d+')">'+ic('plus')+'Il manque '+m+'</button>':b?'<span class="etq ok">Complet</span>':'<span class="etq">Pas besoin</span>')+'</div>'}).join('');
  return h+'</section>'}
function caseP(w,p,d){var cur=S.pl[w][p][d];
  var L=CH.map(function(c){var m=BES[c.id][w][d]-compte(w,c.id,d)+(cur===c.id?1:0);return '<button class="ln pk" onclick="poser('+w+',\''+p+'\','+d+',\''+c.id+'\');fermer()"><span class="dotc big '+c.id+'"></span><span class="tx"><b>'+c.n+'</b><small>'+c.l+'</small></span>'+(cur===c.id?'<span class="etq ok">Actuel</span>':m>0?'<span class="etq alert">Il manque '+m+'</span>':'')+'</button>'}).join('');
  L+='<div class="row" style="margin-top:10px">'+[['cg','Congé'],['fo','Formation'],['dp','Dépôt'],['','Libre']].map(function(o){return '<button class="btn2 pk" onclick="poser('+w+',\''+p+'\','+d+',\''+o[0]+'\');fermer()">'+o[1]+'</button>'}).join('')+'</div>';
  fen('<h3>'+p+' · '+JOURS[d]+' '+DATES[w][d]+'</h3><p class="muted" style="margin:0 0 10px">Où travaille '+p+' ce jour-là ?</p>'+L)}
function poser(w,p,d,c,muet){if(S.pl[w][p][d]===c){if(!muet)re();return}S.pl[w][p][d]=c;S.chg[w+p+d]=1;S.vu[p]=false;save();if(!muet){re();toast(p+' : '+JOURS[d].toLowerCase()+' → '+nomCase(c)+'. Il sera prévenu.','cal')}}
function ajoutCh(w,ch,d){var libres=EQUIPE.filter(function(p){var c=S.pl[w][p][d];return !c||(c!==ch&&BES[c]&&compte(w,c,d)>BES[c][w][d])});
  fen('<h3>'+CHN[ch]+' · '+JOURS[d]+' '+DATES[w][d]+'</h3><p class="muted" style="margin:0 0 10px">Qui peut venir ?</p>'+(libres.length?libres.map(function(p){var c=S.pl[w][p][d];return ln('team',p,c?'Prévu sur '+nomCase(c)+', où il y a assez de monde':'Libre ce jour-là','poser('+w+',\''+p+'\','+d+',\''+ch+'\');fermer()')}).join(''):'<p>Personne n\'est libre. Cliky peut chercher un artisan partenaire.</p>')+
   '<h3 style="font-size:15px;margin:14px 0 6px">Tous les autres</h3>'+EQUIPE.filter(function(p){return libres.indexOf(p)<0&&S.pl[w][p][d]!==ch}).map(function(p){return ln('team',p,'Prévu sur '+nomCase(S.pl[w][p][d]),'poser('+w+',\''+p+'\','+d+',\''+ch+'\');fermer()')}).join(''))}
function semaineCopie(p,w){fen('<h3>'+p+' toute la semaine</h3>'+CH.map(function(c){return ln('box',c.n,c.l,'[0,1,2,3,4].forEach(function(d){poser('+w+',\''+p+'\',d,\''+c.id+'\',1)});fermer();re();toast(\''+p+' est sur '+CHN[c.id]+' toute la semaine\',\'cal\')')}).join(''))}
function envoyerPl(){S.envoye=1;EQUIPE.forEach(function(p){S.vu[p]=false});S.chg={};save();re();toast('Chacun reçoit sa semaine sur son téléphone','send');
  setTimeout(function(){['Mathieu','Damien','Benoît','Thomas'].forEach(function(p){S.vu[p]=true});save();if(role()==='chef'&&onglet.chef==='pl')re()},2500)}
/* côté ouvrier : sa semaine, avec les changements à confirmer */
V.sem=function(){var p=N.ouvrier,w=S.plv.semO||0,L=S.pl[w][p],chg=[0,1,2,3,4].some(function(d){return S.chg[w+p+d]})||(S.envoye&&!S.vu[p]);
  var h='<h1>Ma semaine</h1><div class="semnav"><button class="rond2 pk" onclick="S.plv.semO=0;save();re()" '+(w?'':'disabled style="opacity:.3"')+' aria-label="Semaine d\'avant">'+ic('left')+'</button><b style="font-size:15px">'+SEMS[w]+'</b><button class="rond2 pk" onclick="S.plv.semO=1;save();re()" '+(w?'disabled style="opacity:.3"':'')+' aria-label="Semaine d\'après">'+ic('right')+'</button></div><div class="pile">';
  if(chg)h+='<div class="ck-top monte"><span class="ico">'+ic('cal')+'</span><div><b class="t">Votre planning a changé</b><p>'+N.chef+' a mis à jour votre semaine. Regardez les jours marqués, puis confirmez.</p><button class="btn2" style="margin-top:10px;background:var(--nuit-fg);color:var(--nuit)" onclick="S.vu[N.ouvrier]=true;[0,1,2,3,4].forEach(function(d){delete S.chg[\''+w+'\'+N.ouvrier+d]});RT.evt(\'ouvrier\',N.ouvrier,\'A vu son planning\',\'check\');save();re();toast(N.chef+\' voit que c\\\'est lu\',\'check\')">'+ic('check')+'J\'ai vu</button></div></div>';
  h+='<section class="blk monte">'+L.map(function(c,d){var C=CH.filter(function(x){return x.id===c})[0],neu=S.chg[w+p+d];
    return '<div class="jr'+(w===0&&d===0?' aujr':'')+'" style="cursor:default"><span class="jd"><b>'+JOURS[d]+'</b><small>'+DATES[w][d]+'</small></span><span class="dotc '+(c||'off')+'"></span><span class="tx"><b>'+(C?C.n:nomCase(c))+'</b><small>'+(C?C.l+' · 8 h → 17 h · avec '+(EQUIPE.filter(function(x){return x!==p&&S.pl[w][x][d]===c}).join(', ')||'personne'):'')+'</small></span>'+(neu?'<span class="etq warn">Nouveau</span>':'')+'</div>'}).join('')+'</section>';
  h+='<p class="muted" style="font-size:12px;text-align:center">Vous voyez seulement votre semaine. Le planning de toute l\'équipe est chez '+N.chef+'.</p>';
  return h+'</div>'};

/* ================= MOTIVATION : 10 secondes par jour, pour toute l'équipe ================= */
if(!S.jeu)S.jeu={on:1,defi:'photos',val:22,rec:'Croissants lundi matin',rep:-1,pouce:0,serie:12};
var DEFIS={photos:['photos de fin de journée',30,'cam'],point:['jours sans oubli de pointage',30,'clock'],range:['chantiers laissés propres le soir',25,'check']};
var RECS=['Croissants lundi matin','Resto d\'équipe le vendredi','Une demi-journée offerte'];
var QJ={
 placo:['Pour une cloison en BA13, on espace les montants de combien en général ?',['40 cm','60 cm','90 cm'],1,'60 cm d\'axe en axe, c\'est l\'entraxe courant. On resserre à 40 cm pour poser du lourd ou du carrelage.'],
 peint:['Sur un placo neuf, avant la peinture de finition, on passe d\'abord…',['rien du tout','une sous-couche d\'impression','du vernis'],1,'La sous-couche d\'impression évite que le carton et les bandes boivent la peinture différemment.'],
 elec:['Avant de toucher un circuit, on fait quoi ?',['On coupe le disjoncteur','On coupe, on condamne et on vérifie l\'absence de tension','On fait vite'],1,'Couper ne suffit pas : on empêche qu\'on remette le courant, et on vérifie avec un appareil.'],
 plomb:['Pente conseillée pour une évacuation ?',['0,5 mm par mètre','1 à 3 cm par mètre','10 cm par mètre'],1,'Entre 1 et 3 cm par mètre : assez pour que ça coule, pas trop pour ne pas laisser les déchets derrière.']};
function defiCarte(chef){var J=S.jeu,D=DEFIS[J.defi],p=Math.min(1,J.val/D[1]);
  return '<section class="blk monte defi"><div class="post"><h2 style="margin:0">'+ic('trophy')+'Défi de l\'équipe</h2><span class="etq ok">'+J.serie+' jours de suite</span></div>'+
   '<p style="margin:8px 0 2px;font-size:15px"><b>'+J.val+' / '+D[1]+'</b> '+D[0]+' cette semaine</p><div class="jauge"><i style="width:'+Math.round(p*100)+'%"></i></div>'+
   '<p class="muted" style="font-size:13px;margin:8px 0 0">'+(p>=1?'Défi réussi ! ':'Si la jauge est pleine vendredi : ')+'<b style="color:var(--fg)">'+J.rec+'</b>'+(chef?'':' pour tout le monde')+'</p></section>'}
function questionJour(){var mes=(S.mesMet[N.ouvrier]||[]).filter(function(k){return QJ[k]&&S.metiers[k]}),k=mes[0]||'elec',q=QJ[k],r=S.jeu.rep;
  var h='<section class="blk monte"><div class="post"><h2 style="margin:0">'+ic('idea')+'La question du jour</h2><span class="etq">10 secondes</span></div><p style="margin:10px 0;font-size:15px;font-weight:700">'+q[0]+'</p><div class="qrep">';
  h+=q[1].map(function(t,i){var cl=r<0?'':i===q[2]?' bon':i===r?' faux':' gris';return '<button class="pk'+cl+'" '+(r<0?'onclick="repondre('+i+','+q[2]+')"':'disabled')+'>'+t+'</button>'}).join('')+'</div>';
  if(r>=0)h+='<p style="margin:10px 0 0;font-size:14px"><b>'+(r===q[2]?'Bien joué.':'Presque !')+'</b> '+q[3]+'</p><p class="muted" style="font-size:12px;margin:6px 0 0">Toute l\'équipe a la même question. Les réponses ne sont pas notées.</p>';
  return h+'</section>'}
function repondre(i,b){S.jeu.rep=i;save();re();if(i===b)toast('Bonne réponse','check')}
function pouceCarte(){return S.jeu.pouce?'<div class="ck-top monte pouce"><span class="ico">'+ic('thumb')+'</span><div><b class="t">Mme Rey a aimé votre travail</b><p>« Bravo, la chambre est déjà méconnaissable ! » sur la photo d\'aujourd\'hui. Toute l\'équipe du chantier le voit.</p></div></div>':''}
function bravo(){S.jeu.pouce=1;RT.evt('client','Mme Rey','Bravo à l\'équipe sur la photo du jour','thumb');save();re();toast('Merci ! L\'équipe le voit tout de suite','thumb')}
function motivReglages(){var J=S.jeu;
  return '<div class="post"><span style="font-size:14px;font-weight:700">Défi, question du jour et pouce du client</span><button class="sw'+(J.on?' on':'')+'" onclick="S.jeu.on=S.jeu.on?0:1;save();re()" aria-label="Activer"><i></i></button></div>'+
   (J.on?'<p class="lab2">Le défi de la semaine</p><div class="row chips">'+Object.keys(DEFIS).map(function(k){return '<button class="pk" aria-pressed="'+(J.defi===k)+'" onclick="S.jeu.defi=\''+k+'\';save();re()">'+DEFIS[k][1]+' '+DEFIS[k][0]+'</button>'}).join('')+'</div>'+
   '<p class="lab2">La récompense</p><div class="row chips">'+RECS.map(function(r){return '<button class="pk" aria-pressed="'+(J.rec===r)+'" onclick="S.jeu.rec=\''+r.replace(/'/g,"\\'")+'\';save();re()">'+r+'</button>'}).join('')+'</div>'+
   '<p class="muted" style="font-size:12px;margin:10px 0 0">Jamais de classement entre les personnes, et rien de lié aux salaires : c\'est l\'équipe qui gagne ensemble.</p>':'<p class="muted" style="font-size:13px;margin:8px 0 0">Désactivé : l\'équipe ne voit ni défi ni question.</p>')}

/* ================= GESTION (patrons) : devis, factures, clients, chiffres, commandes ================= */
if(!S.ges)S.ges='dev';
function sansTitre(h){return h.replace(/^<h1>.*?<\/h1><p class="sous">.*?<\/p>/,'')}
V.ges=function(){var g=S.ges;
  var h='<h1>Gestion</h1><p class="sous">Les patrons voient tout : devis, factures, clients et chiffres</p>';
  h+='<div class="row chips" style="margin-bottom:12px">'+[['dev','Devis'],['fac','Factures'],['cli','Clients'],['chf','Chiffres'],['cmd','Commandes']].map(function(o){return '<button class="pk" aria-pressed="'+(g===o[0])+'" onclick="S.ges=\''+o[0]+'\';save();re()">'+o[1]+'</button>'}).join('')+'</div>';
  if(g==='dev')h+=sansTitre(V.dem());else if(g==='fac')h+=sansTitre(V.fac());else if(g==='cmd')h+=sansTitre(V.cmd());else if(g==='cli')h+=vueClients();else h+=vueChiffres();
  return h};

 {n:'Cabinet Martin',l:'Saint-Martin-d\'Hères',e:'Chantier en cours',ch:'cab',ca:22400,pay:11200},{n:'M. et Mme Girard',l:'Alpe d\'Huez',e:'Chantier en cours',ch:'hue',ca:64000,pay:44800},
 {n:'Durand',l:'Domène',e:'Devis envoyé',ca:14800},{n:'Petit',l:'La Tronche',e:'Devis envoyé',ca:56000},{n:'Garnier',l:'Crolles',e:'Devis envoyé',ca:9400},{n:'Mme Lopez',l:'Saint-Ismier',e:'Demande'},{n:'M. Blanc',l:'Gières',e:'Demande'}];
function vueClients(){return '<div class="pile">'+blk('Clients ('+CLI.length+')','users',CLI.map(function(c,i){return '<button class="ln pk" onclick="ficheCli('+i+')">'+(c.ch?pastille(c.ch,undefined,1):'<span class="pa big dvp">◆</span>')+'<span class="tx"><b>'+c.n+'</b><small>'+c.l+' · '+c.e+(c.ca?' · '+eur(c.ca)+' HT':'')+'</small></span>'+(c.ret?'<span class="etq alert">Retard</span>':'<span class="fl">'+ic('arrow')+'</span>')+'</button>'}).join(''))+'</div>'}
function ficheCli(i){var c=CLI[i],C=c.ch&&CH.filter(function(x){return x.id===c.ch})[0];
  fen('<h3>'+c.n+'</h3><p class="muted" style="margin:0 0 10px">'+c.l+' · '+c.e+'</p><div class="blk"><div class="post"><span>Téléphone</span><b>06 00 00 00 00</b></div><div class="post" style="margin-top:6px"><span>E-mail</span><b>client@exemple.fr</b></div></div>'+
   (c.ca?'<div class="chif" style="margin-top:10px"><div><b>'+eur(c.ca)+'</b><small>devis HT</small></div><div><b>'+(c.pay?eur(c.pay):'—')+'</b><small>payé</small></div>'+(C?'<div><b>'+C.mgt+' %</b><small>marge</small></div><div><b>'+ETP[C.e]+'</b><small>étape</small></div>':'')+'</div>':'')+
   (C?'<button class="go" style="width:100%;margin-top:12px" onclick="fermer();ficheCh(\''+c.ch+'\')">'+ic('box')+'Voir le chantier</button>':'<button class="go" style="width:100%;margin-top:12px" onclick="fermer();toast(\'Relance préparée par Cliky\',\'send\')">'+ic('send')+(c.e==='Demande'?'Proposer une visite':'Relancer le devis')+'</button>'))}
function vueChiffres(){
  var h='<div class="pile">'+blk('Ce mois-ci','euro','<div class="chif"><div><b>86 400 €</b><small>signé HT</small></div><div><b>54 300 €</b><small>encaissé</small></div><div><b>19 040 €</b><small>à encaisser</small></div><div><b>80 200 €</b><small>devis en attente</small></div></div>');
  h+=blk('Marge par chantier','box',CH.map(function(c){var bad=c.mgt<c.mg-3;return '<div style="padding:8px 0"><div class="post"><span>'+pastille(c.id)+' <b style="font-size:14px">'+c.n+'</b></span><b style="color:var(--'+(bad?'alert':'ok')+')">'+c.mgt+' %</b></div><div class="barre"><i style="width:'+c.mgt*3+'%;background:'+CC[c.id]+'"></i></div><small class="muted">Prévue '+c.mg+' %'+(bad?' · '+c.note:'')+'</small></div>'}).join(''));
  h+=blk('Les devis','doc','<div class="chif"><div><b>12</b><small>envoyés en 3 mois</small></div><div><b>7</b><small>signés</small></div><div><b>58 %</b><small>signés</small></div><div><b>9 j</b><small>pour signer</small></div></div>');
  return h+'</div>'}

/* vraie carte de l'Espace (fond OpenFreeMap) avec les bulles en direct ; repli sur la carte dessinée */
function bulleHtml(c){var Q=qui(0,c.id,0),T=stJour(c.id,0,0);
  return '<span class="vb" style="--cc:'+CC[c.id]+'"><span class="vl">'+LET[c.id]+'</span>'+(Q.length||T.length?Q.map(function(q){return '<span class="va">'+q[0]+'<i class="'+(TEL[q]?'ok':'warn')+'"></i></span>'}).join('')+T.map(function(t){return '<span class="va st">'+t.n+'</span>'}).join(''):'<span class="vv">–</span>')+'</span><span class="vq" style="--cc:'+CC[c.id]+'"></span>'}
function vraie(){var el=$('vc');if(!el||!window.VraieCarte)return;var f=CARTE_F,P=[];
  P.push({lat:45.219,lon:5.862,ancre:'center',html:'<span class="vdep" title="Dépôt"></span>'});
  if(f!=='ch')DEVIS.forEach(function(v,i){P.push({lat:v.g[0],lon:v.g[1],ancre:'center',html:'<span class="vdv" title="'+v.n+'"></span>',onClick:function(){voirDevis(i)}})});
  if(f!=='dv')CH.forEach(function(c){P.push({lat:GEO[c.id][0],lon:GEO[c.id][1],z:2,html:bulleHtml(c),onClick:function(){ficheCh(c.id)}})});
  VraieCarte(el,{bornes:[[5.66,45.07],[6.10,45.30]],points:P})}
(function(){var r=new URLSearchParams(location.search).get('r');if(r&&RT.ROLES[r]){S.role=r;save()}})();
rRoles();go(onglet[role()]);

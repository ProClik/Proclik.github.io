<title>Prise de cotes</title>
<!-- Prise de cotes menuiserie (Cyril, 14/11) : maquette https://claude.ai/artifact/7Wp5JY3aFvDP7Bh9if4iCx devenue page réelle.
     Une question à la fois, le mètre dans une main : téléphone d'abord, chaque écran tient sans défiler.
     Réutilisable seule (ex. démo fournisseur) :
       cotes.html                        démonstration (client et cotes d'exemple, rien n'est gardé)
       cotes.html?r=<id>&c=<chantier>&four=<fournisseur>&fab=<fabricant>&qui=<prénom>&embed=1
     Données : localStorage « pc-cotes » = { <id>: {id, chantier, four, lastFab, t0, t, items:[menuiserie…]} }
       menuiserie : no, type, piece, fab, pose, L/H/D (3 mesures en mm), Li/Hi (volet, côté intérieur), ouv, sens, vol, mat, ci, ce, vitr, ph (photos), fini…
     Messages au cadre parent : proclik-cotes-close, proclik-cotes-plan, proclik-cotes-maj.
     Le plan (plan.html) relit « pc-cotes » : « Reprendre une cote prise sur place » dans la fiche d'une fenêtre ou d'une porte. -->

<style>
/* Maquette « Prise de cotes menuiserie » au style N1 : bleu nuit pour les actions, laiton en touche, seul ce qui se touche est en relief. */
:root{

}
:root[data-theme="dark"]{--wall:#2C3347;--wall2:#3A4259;--old:#6E778D;--glass:#2A3A52;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--wall:#2C3347;--wall2:#3A4259;--old:#6E778D;--glass:#2A3A52;color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:500 15px/1.45 var(--f);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--laiton);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font:800 22px var(--f)}
.top .tag{font:700 12px var(--f);color:var(--muted)}
.tabs{display:flex;gap:6px;padding:5px;border-radius:999px;box-shadow:var(--in);width:max-content;max-width:100%;overflow-x:auto}

.tabs button[aria-selected="true"]{background:var(--bg);box-shadow:var(--up);color:var(--fg)}
.view[hidden]{display:none!important}



[hidden]{display:none!important}
/* dictée : le micro toujours au centre, en bas */
.dkl{border:0;background:transparent;color:var(--muted);font:700 13px var(--f);padding:6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:center}
.foot{position:relative}
.mic{position:absolute;left:50%;top:50%;transform:translate(-50%,-44%);width:54px;height:54px;border-radius:50%;border:0;background:var(--bg);box-shadow:var(--pk),0 0 0 1px color-mix(in srgb,var(--laiton) 45%,transparent);display:grid;place-items:center;color:var(--nuit);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mic svg{width:24px;height:24px}
.mic.on{background:var(--nuit);color:var(--nuit-fg);box-shadow:0 0 0 0 color-mix(in srgb,var(--laiton) 60%,transparent);animation:micp 1.4s ease-out infinite}
@keyframes micp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--laiton) 55%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none;box-shadow:0 0 0 3px var(--laiton)}}
.heard{position:absolute;left:12px;right:12px;bottom:84px;z-index:3;background:var(--nuit);color:var(--nuit-fg);border-radius:14px;padding:8px 12px;font:700 13.5px var(--f);text-align:center;pointer-events:none;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}

.bpd{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.bpd button{min-height:58px;border-radius:13px;border:0;background:var(--bg);box-shadow:var(--pk);cursor:pointer;display:grid;place-items:center;align-content:center;gap:1px;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;color:var(--fg);touch-action:manipulation;position:relative}

.bpd button[aria-pressed="true"]{background:var(--teinte);box-shadow:0 0 0 1.5px var(--nuit)}
.oth{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:6px;align-items:center;margin-top:8px;padding:8px;border-radius:13px;background:var(--bg);box-shadow:var(--in)}

.oth .go{min-height:40px;padding:0 14px;border-radius:11px;font-size:14px}
/* photos là où c'est utile */
.qt{display:flex;gap:10px;align-items:flex-start}.qt>div{flex:1;min-width:0}

.phx{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* nouvelle menuiserie : copier la précédente */

.cp button{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:16px;border:0;background:var(--bg);box-shadow:var(--pk);cursor:pointer;color:var(--fg)}

/* récap compact : une ligne par partie */
.rs{display:grid;gap:5px}
.rs button{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;padding:6px 12px;border-radius:13px;border:0;background:var(--bg);box-shadow:var(--pk);cursor:pointer;color:var(--fg)}

.rs button em{font-style:normal;font-size:11px;font-weight:800;color:var(--laiton);white-space:nowrap}
.rs button em.ok{color:var(--ok)}
.rs .phs{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}.rs .phs img{width:20px;height:20px;border-radius:5px;object-fit:cover}
.rcf{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:auto}.rcf:empty{display:none}.rcq{display:grid;gap:10px;margin-top:auto;padding:14px;border-radius:18px;background:var(--calme);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--laiton) 45%,transparent)}.rcq>b{font-size:18px;font-weight:800;text-align:center}.rcq>small{text-align:center;color:var(--muted);font-weight:700;font-size:13px;margin-bottom:-6px}.rcq-b button{white-space:nowrap}.rcq-b{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rcq-b button{min-height:52px}
/* ---------- maquette : téléphone ---------- */
.demo{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start}

.phone{position:relative;border-radius:30px;background:var(--bg);box-shadow:0 0 0 1px var(--line),0 24px 60px -24px rgba(14,19,34,.35);min-height:740px;display:flex;flex-direction:column;overflow:hidden}

.ph-h{display:flex;align-items:center;gap:10px;padding:10px 12px 6px}

.secs{display:flex;gap:5px;overflow-x:auto;padding:2px 12px 6px;scrollbar-width:none}.secs::-webkit-scrollbar{display:none}

.blk{background:var(--calme);border-radius:18px;box-shadow:var(--calme-sh);padding:9px}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.ill{border-radius:16px;background:var(--calme);box-shadow:var(--calme-sh);padding:4px;display:grid;place-items:center;height:min(25svh,150px)}

.rc{display:grid;gap:6px}.rcg{display:grid;gap:6px;padding:10px}.rcg h5{margin:2px 4px;font:800 11px var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--laiton)}

.list{display:grid;gap:9px}.irow{display:flex;align-items:center;gap:6px}.irow>.item{flex:1;min-width:0}.idel{flex:none;width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}.idel svg{width:21px;height:21px}.idel:active{background:color-mix(in srgb,#C0392B 12%,transparent);color:#B23A2E}.toast{display:flex;align-items:center;gap:10px}.tundo{margin-left:auto;flex:none;border:0;border-radius:999px;padding:8px 14px;background:var(--bg);color:var(--nuit);font:800 14px var(--f);cursor:pointer}

/* cotes détaillées pour le bon : toutes les mesures prises, puis la retenue */
function bonV(q,it){const x=it[q.id];
 if((q.id==="L"||q.id==="H")&&Array.isArray(x)){const n=x.filter(Number);return n.length?`<span class="all">${n.join(" · ")}</span> <b>→ ${minOf(x)} mm</b>`:"À vérifier"}
 if(q.id==="D"&&!(Array.isArray(x)&&x.filter(Number).length===2))return "Non relevées";
 if(q.id==="D"&&Array.isArray(x)&&x.filter(Number).length===2)return `<span class="all">${x.join(" · ")}</span> <b>→ ${ecart(x)?"écart "+ecart(x)+" mm":"d'équerre"}</b>`;
 const t=valTxt(q,it);return t&&t!==DK?esc(t):'<b class="ask">À vérifier</b>'}
/* croquis vu de l'intérieur, à l'échelle, avec cotes, vantaux et charnières */
function croquis(it){const L=minOf(it.L)||1000,H=minOf(it.H)||1200,k=Math.min(150/L,130/H),w=L*k,h=H*k,x=60,y=12,nv=parseInt(it.vant)||1,nu="var(--nuit)",la="var(--laiton)";
 const cc=(COUL.find(c=>c[0]===(isVol(it)?it.vcoul:it.ci))||[])[2];const fr=cc&&!/gradient/.test(cc)?cc:"var(--bg)";
 let s=`<svg viewBox="0 0 230 ${h+56}" aria-label="Croquis repère ${it.no}"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fr}" stroke="${nu}" stroke-width="2.5"/><rect x="${x+6}" y="${y+6}" width="${w-12}" height="${h-12}" fill="var(--bg)" stroke="${nu}" stroke-width="1"/>`;
 if(!isVol(it)&&it.ouv!=="Fixe"&&it.type!=="Châssis fixe"&&it.type!=="Baie coulissante"&&it.type!=="Porte de garage"){const pw=w/nv;for(let i=0;i<nv;i++){const x0=x+pw*i,x1=x0+pw,hinge=nv===1?it.sens:(i===0?"G":"D");if(hinge!=="G"&&hinge!=="D")continue;const hx=hinge==="G"?x0+6:x1-6,ox=hinge==="G"?x1-6:x0+6;s+=`<path d="M${ox} ${y+6}L${hx} ${y+h/2}L${ox} ${y+h-6}" fill="none" stroke="${nu}" stroke-width=".9"/>`;if(/Oscillo/.test(it.ouv||"")&&(nv===1||(it.serv==="D"?i===1:i===0)))s+=`<path d="M${x0+6} ${y+6}L${x0+pw/2} ${y+h-6}L${x1-6} ${y+6}" fill="none" stroke="${nu}" stroke-width=".9" stroke-dasharray="3 2"/>`}}
 for(let i=1;i<nv;i++)s+=`<line x1="${x+w*i/nv}" y1="${y}" x2="${x+w*i/nv}" y2="${y+h}" stroke="${nu}" stroke-width="2"/>`;
 if(it.ouv!=="Fixe"&&it.type!=="Châssis fixe"){const side=nv===1?it.sens:it.serv;if(side==="G"||side==="D"){const hx=nv===1?(side==="G"?x:x+w):(side==="G"?x:x+w);s+=`<rect x="${hx-3}" y="${y+h*.15}" width="6" height="12" rx="2" fill="${la}"/><rect x="${hx-3}" y="${y+h*.85-12}" width="6" height="12" rx="2" fill="${la}"/>`;const px=nv===1?(side==="G"?x+w-8:x+8):(side==="G"?x+w/nv-6:x+w-w/nv+6);s+=`<rect x="${px-2}" y="${y+h/2-8}" width="4" height="16" rx="2" fill="${nu}"/>`}}
 if(/Porte-fenêtre/.test(it.type)&&it.sb==="Oui")s+=`<line x1="${x}" y1="${y+h*.78}" x2="${x+w}" y2="${y+h*.78}" stroke="${nu}" stroke-width="1.5"/>`;
 s+=`<line x1="${x}" y1="${y+h+14}" x2="${x+w}" y2="${y+h+14}" stroke="currentColor" stroke-width="1"/><text x="${x+w/2}" y="${y+h+28}" font-size="11" font-weight="800" text-anchor="middle" fill="currentColor">${L}</text>`;
 s+=`<line x1="${x-14}" y1="${y}" x2="${x-14}" y2="${y+h}" stroke="currentColor" stroke-width="1"/><text x="${x-18}" y="${y+h/2+4}" font-size="11" font-weight="800" text-anchor="end" fill="currentColor">${H}</text>`;
 if(it.all&&it.all!==DK)s+=`<text x="${x+w/2}" y="${y+h+44}" font-size="10" text-anchor="middle" fill="var(--muted)">allège ${it.all}</text>`;
 return s+`<text x="${x+w+8}" y="${y+10}" font-size="9.5" fill="var(--muted)">${isBP(it)?"vu côté":"vu de"}</text><text x="${x+w+8}" y="${y+22}" font-size="9.5" fill="var(--muted)">${isBP(it)?"poussant":"l'intérieur"}</text></svg>`}
/* plan d'exemple (Durand) : pièces + repères posés sur les murs */
function planSvg(its){const R={"Séjour":[10,10,150,110],"Cuisine":[160,10,90,70],"Salle de bain":[160,80,90,40],"Chambre":[10,120,120,80],"Entrée":[130,120,120,80]};
 const W={"Séjour":[85,120,"h"],"Cuisine":[205,10,"h"],"Salle de bain":[250,100,"v"],"Chambre":[10,160,"v"],"Entrée":[200,200,"h"]};
 let s=`<svg viewBox="0 0 260 210" aria-label="Plan du logement">`;
 for(const[n,[x,y,w,h]]of Object.entries(R))s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--bg)" stroke="var(--nuit)" stroke-width="3" stroke-linejoin="round"/><text x="${x+w/2}" y="${y+h/2+4}" font-size="10" text-anchor="middle" fill="var(--muted)">${n}</text>`;
 const used={};its.forEach(it=>{const p=W[it.piece];if(!p)return;const o=(used[it.piece]=(used[it.piece]||0)+1)-1;let[cx,cy,d]=p;if(d==="h")cx+=o*26;else cy+=o*22;const ww=d==="h"?22:0,hh=d==="v"?18:0;s+=`<line x1="${cx-ww/2}" y1="${cy-hh/2}" x2="${cx+ww/2}" y2="${cy+hh/2}" stroke="var(--laiton)" stroke-width="6"/><circle cx="${cx+(d==="v"?(cx<20?14:-14):0)}" cy="${cy+(d==="h"?(cy<20?14:-14):0)}" r="8" fill="var(--nuit)"/><text x="${cx+(d==="v"?(cx<20?14:-14):0)}" y="${cy+(d==="h"?(cy<20?14:-14):0)+3.5}" font-size="10" font-weight="800" text-anchor="middle" fill="var(--bg)">${it.no}</text>`});
 return s+"</svg>"}

/* Fiche finale : ordre d'un devis menuiserie (repère, quantité, désignation, dimensions, croquis vue intérieure, caractéristiques par rubrique) */
const GRP=[["Cotes relevées",["L","H","D","all"]],["Pose",["bat","pose","aile","pos","doub","appui","seuil","vrPose","vrExist","vbPose"]],["Ouverture",["vbModele","vant","ouv","ouvP","sens","serv","vbSens"]],["Volet",["vol","vrEnr","volm","volc"]],["Finitions",["mat","ci","ce","vcoul","vitr","sb"]]];
function design(it){const v=it.vant&&!isVol(it)?(it.vant==="1"?" 1 vantail":" "+it.vant+" vantaux"):it.type==="Volets battants"&&it.vant?" "+it.vant+(it.vant==="1"?" battant":" battants"):"";const o=it.ouv&&it.ouv!=="Battant"?" "+it.ouv.toLowerCase():"";return it.type+v+o+(it.mat?" · "+it.mat:"")}

/* Bloc d'une menuiserie dans l'ordre d'un devis Pro Devis : fabricant, titre, Haut × Larg, croquis à gauche, liste à puces à droite */
function blocPD(it){const A='<b class="ask">à vérifier</b>',val=(k,f)=>{const x=it[k];return x&&x!==DK?(f?f(x):esc(x)):A};
 const nv=parseInt(it.vant)||1,vol=isVol(it),porte=isPorte(it);
 const titre=vol?it.type+(it.type==="Volets battants"&&it.vant?" "+it.vant+(it.vant==="1"?" battant":" battants"):"")+(it.mat?" ("+it.mat+")":""):it.type+(it.vant&&it.type!=="Châssis fixe"?" "+(nv===1?"1 vantail":it.vant+" vantaux"):"")+(it.mat?" ("+it.mat+")":"");
 const li=[];const add=x=>x&&li.push(x);
 if(isBP(it)){add("Pose : "+val("bpPose",x=>esc(x.toLowerCase())));add("Porte : "+val("bpMod"));add("Finition : "+val("bpFin"));add("Huisserie pour cloison de "+val("ep"));add(bpStd(it)?"Porte de "+val("bpDim",x=>esc(x.replace(/^Autre : /,"")))+(/^Autre/.test(it.bpDim||"")?"":" cm (dimension standard)"):"Dimensions de l'ouverture dans la cloison");if(it.sens==="G"||it.sens==="D")add("Poussant "+(it.sens==="D"?"droite":"gauche"));add("Serrure : "+val("bpSer"));
  const mes=["L","H","Li","Hi","D"].map(k=>{const q=steps(it).find(x=>x.id===k);return q?`<tr><td>${esc(bonT(q,it))}</td><td>${bonV(q,it)}</td></tr>`:""}).join("");
  return `<section class="frep"><div class="fab">${esc((it.fab||"Fabricant à choisir").toUpperCase())}</div><div class="pdt"><b>${esc("Bloc-porte intérieur"+(it.bpMod&&it.bpMod!==DK?" "+it.bpMod.toLowerCase():""))}</b><b>Haut ${minOf(it.H)||"?"} mm x Larg ${minOf(it.L)||"?"} mm</b><small>Repère ${it.no} · ${esc(it.piece||"")} · quantité 1</small></div><div class="frb"><div class="cro">${croquis(it)}</div><ul class="pdl">${li.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="fg"><h5>Cotes relevées sur place</h5><table>${mes}</table></div></section>`}
 if(vol){add("Couleur du volet : "+val("vcoul"))}else{add("Couleur intérieure de la menuiserie : "+val("ci"));add("Couleur extérieure de la menuiserie : "+val("ce"))}
 if(it.type==="Volet roulant"){add("Pose : "+val("vrPose"));add("Volet existant : "+val("vrExist"))}
 else if(it.type==="Volets battants"){add("Modèle : "+val("vbModele"));add("Accroche : "+val("vbPose"))}
 else if(it.pose==="reno"){add("Pose : "+esc(v("reno")));add(esc(v("aile"))+" : "+val("aile"))}
 else{add("Pose : "+val("pos",x=>esc(v(x)||x)));if(it.pos==="app")add("Tapée : "+val("doub"))}
 add(vol?"Dimensions tableau extérieur":it.pose==="reno"?"Dimensions dos de dormant existant":"Dimensions tableau");
 if(steps(it).some(q=>q.id==="appui"))add("Appui : "+val("appui"));if(steps(it).some(q=>q.id==="seuil"))add("Seuil : "+val("seuil"));
 if(!vol&&it.type!=="Porte de garage")add("Vitrage : "+val("vitr"));
 if(!vol&&!porte&&it.type!=="Châssis fixe"&&it.type!=="Baie coulissante")add("Ouverture intérieure");
 if(porte&&it.ouvP)add("Ouverture "+(it.ouvP==="Vers moi"?"intérieure (poussant)":"extérieure (tirant)"));
 if(it.sens==="G"||it.sens==="D")add(porte?"Paumelles à "+(it.sens==="D"?"droite":"gauche")+" (vue intérieure)":(it.sens==="D"?"Droite":"Gauche")+" tirant (vue intérieure)");
 if(it.serv==="G"||it.serv==="D")add("Vantail principal à "+(it.serv==="D"?"droite":"gauche")+" (vue intérieure)");
 if(it.vbSens==="G"||it.vbSens==="D")add("Gonds à "+(it.vbSens==="D"?"droite":"gauche")+" (vue extérieure)");
 if(!vol&&it.vant&&it.type!=="Châssis fixe")add((nv===1?"1 vantail":it.vant+" vantaux")+(it.ouv?" "+it.ouv.toLowerCase()+(nv>1&&it.ouv!=="Fixe"?"s":""):""));
 if(it.type==="Porte-fenêtre")add("Soubassement : "+val("sb"));
 if(!vol&&it.vol)add("Volet : "+val("vol"));
 if(it.vrEnr)add("Enroulement "+val("vrEnr",x=>esc(x.toLowerCase())));if(it.volm)add("Manœuvre du volet : "+val("volm"));if(it.volc==="G"||it.volc==="D")add("Commande du volet à "+(it.volc==="D"?"droite":"gauche")+" (vue intérieure)");
 if(it.all&&it.all!==DK)add("Allège : "+esc(it.all)+" mm");
 if(it.epm&&it.epm!==DK)add("Épaisseur du mur : "+esc(it.epm)+" mm");
 if(it.air)add("Entrée d'air : "+val("air"));
 if(it.anc)add("Ancienne menuiserie : "+val("anc"));
 if(it.mur&&it.mur!==DK)add("Emplacement : mur "+esc(it.mur.toLowerCase())+(it.dist&&it.dist!==DK?", à "+esc(it.dist)+" mm de l'angle gauche":""));

  if(S.fromRc&&steps(it).slice(step+1).every(x=>valTxt(x,it)!=="")){S.fromRc=false;mode="rc";render();return}step=nxt(it,step);dir=1;cur3=0;render();return}
 if(a==="mic"){DIC.on?micStop():micStart();return}
 if(a==="del"){const k=+b.dataset.i,x=S.items[k];if(!x)return;UNDO=JSON.stringify(S.items);S.items.splice(k,1);renum();cur=null;say((x.type||"Menuiserie")+" n°"+x.no+" supprimée",6000);return}
 if(a==="undo"){if(UNDO){S.items=JSON.parse(UNDO);UNDO=null}clearTimeout(tt);toast="";render();return}
 if(a==="list"){if(DIC.on)micStop();mode="list";cur=null;render();return}
 if(a==="end"){mode="end";render();return}
 if(a==="open"){cur=+b.dataset.i;const x=S.items[cur];if(!x.fab&&S.lastFab)x.fab=S.lastFab;if(x.fab)V=FABV(x.fab),vs();mode=x.fini?"rc":"wz";step=0;dir=1;cur3=0;if(!x.fini){const L=steps(x);step=Math.max(0,L.findIndex(q=>valTxt(q,x)===""));}render();return}
 if(a==="add"){const last=[...S.items].reverse().find(i=>i.fini);if(last){mode="new";render();return}newItem(null);return}
 if(a==="copy"){newItem(S.items[+b.dataset.i]);return}
 if(a==="blank"){newItem(null);return}
 if(a==="donext"){it.fini=true;it.fromPlan=false;finTime(it);newItem(it);say("N°"+it.no+" prête"+dur(it)+". On enchaîne avec la suivante.");return}
 if(a==="prev"){if(step===0){mode="list";cur=null}else{step--;dir=-1;cur3=0}render();return}
 if(a==="next"){step=nxt(it,step);dir=1;cur3=0;render();return}
 if(a==="goto"){mode="wz";S.fromRc=true;step=+b.dataset.i;dir=1;cur3=0;render();return}
 if(a==="sec"){clearTimeout(adv);const n=+b.dataset.s;dir=n<step?-1:1;step=n;cur3=0;render();return}
 if(a==="rcv"){clearTimeout(adv);S.back=step;mode="rc";render();return}
 if(a==="resume"){mode="wz";step=S.back||0;dir=0;render();return}
 if(a==="done"){it.fini=true;it.fromPlan=false;finTime(it);mode="list";cur=null;say("Menuiserie n°"+it.no+" prête"+dur(it)+" ✓");return}
 /* Cyril 23/11 : à la fin d'une menuiserie, « Il y en a d'autres ? » ; « Non, c'est tout » mène à l'écran de fin */
 if(a==="fin"){it.fini=true;it.fromPlan=false;finTime(it);cur=null;if(S.items.every(i=>i.fini)){mode="end";render()}else{mode="list";say("Menuiserie n°"+it.no+" prête ✓. Il reste "+S.items.filter(i=>!i.fini).length+" à finir.")}return}
 if(a==="bon"){mode="bon";render();return}
 if(a==="close"){if(DIC.on)micStop();save();try{parent.postMessage({type:"proclik-cotes-close",r:RID},"*")}catch(x){}return}
 if(a==="pdf"&&RID){setTimeout(()=>window.print(),50);return}
 if(a==="send"&&RID){say("L'envoi direct arrive bientôt. En attendant : « Créer le PDF » et joignez-le à votre e-mail.");return}
 if(a==="plan"&&RID){try{parent.postMessage({type:"proclik-cotes-plan",r:RID,c:S.chantier},"*")}catch(x){}if(!EMB)say("Ouvrez le plan du chantier : chaque fenêtre propose « Reprendre une cote prise sur place ».");return}
 if(a==="pdf"){say("Maquette : en vrai, le PDF « Cotes Durand 14-11.pdf » est créé et rangé dans le chantier.");return}
 if(a==="send"){say("Maquette : rien n'est envoyé. En vrai, le PDF part par e-mail.");return}
 if(a==="plan"){S.plan=true;say("Plan fait : les menuiseries sont posées sur les murs, il est ajouté au bon.");return}
 if(a==="devis"){say("Fenêtres ajoutées au pré-devis Durand, « En attente fournisseur ».");return}
 if(b.dataset.cam){camK=b.dataset.cam;let ok=false;try{CAM.click();ok=true}catch(x){}clearTimeout(window._phT);window._phT=setTimeout(()=>{if(!RID&&document.hasFocus()&&!(it.ph||{})[camK]&&!CAM.files.length)savePh(camK,fakePh(camK))},1400);return}
 if(b.dataset.v!=null&&mode==="wz"){const q=steps(it)[step];
  if(q.kind==="m3"||q.kind==="m1"){it[q.id]=DK}else it[q.id]=b.dataset.v;
  if(q.id==="fab"){S.lastFab=it.fab;V=FABV(it.fab);vs()}
  if(q.id==="bpDim"){const m=(it.bpDim||"").match(/(\d+) × (\d+)/);if(m){it.L=[+m[1]*10];it.H=[+m[2]*10]}}
  if(q.id==="bpPose"&&!bpStd(it)&&it.bpDim){delete it.bpDim;it.L=[];it.H=[]}
  // réponses déduites : on les met d'office, on peut les changer
  steps(it).forEach(x=>{if(x.auto&&it[x.id]==null){const g=x.auto(it);if(g)it[x.id]=g}});
  if(q.id==="ce"&&it.ce==="Comme l'intérieur")it.ce=it.ci;
  b.parentElement.querySelectorAll("button[data-v]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  clearTimeout(adv);adv=setTimeout(()=>{if(S.fromRc&&valTxt(q,it)!==""&&steps(it).slice(step+1).every(x=>valTxt(x,it)!=="")){S.fromRc=false;mode="rc";render();return}step=nxt(it,step);dir=1;cur3=0;render()},190);return}
});
P.addEventListener("input",e=>{
 const t=e.target,it=S.items[cur];if(!it)return;
 if(t.dataset.m1){const q=steps(it)[step];it[t.dataset.m1]=t.value.replace(/\D/g,"");const al=P.querySelector(".alert"),m=chk(q,[it[t.dataset.m1]]);if(al){al.hidden=!m;al.textContent=m}return}
 if(t.dataset.m!=null){const q=steps(it)[step];if(!Array.isArray(it[q.id]))it[q.id]=[];const val=t.value.replace(/\D/g,""),k=+t.dataset.m,au=(it._auto=it._auto||{})[q.id]=it._auto[q.id]||[];it[q.id][k]=val;au[k]=false;t.classList.remove("auto");
  /* 1re mesure tapée : les autres prennent la même valeur, on ne change que celles qui diffèrent */
  if(k===0)for(let j=1;j<q.labs.length;j++){if(!it[q.id][j]||au[j]){it[q.id][j]=val;au[j]=!!val;const f=P.querySelector("#m"+j);if(f){f.value=val;f.classList.toggle("auto",!!val)}}}
  const m=minOf(it[q.id]),e=ecart(it[q.id]),keep=P.querySelector(".keep"),al=P.querySelector(".alert"),go=P.querySelector('[data-a="next"]');
  if(keep){keep.hidden=!m||q.id==="D";keep.querySelector("b").textContent=m+" mm"}
  if(al){const g=chk(q,it[q.id]);al.hidden=!(e>10||g);al.textContent=g||alertTxt(q,e)}
  if(go){go.disabled=!m&&!q.opt;go.textContent=q.opt&&!m?"Passer":"Continuer"}
}
});
P.addEventListener("focusin",e=>{const t=e.target;if(t.dataset&&t.dataset.m!=null&&t.value){t._sel=1;setTimeout(()=>{try{t.select()}catch(x){}},0)}if(t.dataset&&t.dataset.m!=null&&+t.dataset.m!==cur3){cur3=+t.dataset.m;P.querySelectorAll(".mrow").forEach((r,i)=>r.classList.toggle("cur",i===cur3));P.querySelectorAll(".ill .mk[data-k]").forEach(g=>g.classList.toggle("on",+g.dataset.k===cur3))}});

/* toucher une case déjà remplie : tout est sélectionné, on tape directement la bonne valeur */
P.addEventListener("pointerup",e=>{const t=e.target;if(t.dataset&&t.dataset.m!=null&&t._sel){t._sel=0;e.preventDefault();try{t.select()}catch(x){}}});
P.addEventListener("keydown",e=>{const t=e.target;if(e.key!=="Enter"||!t.dataset||(t.dataset.m==null&&!t.dataset.m1))return;e.preventDefault();const n=t.dataset.m!=null&&P.querySelector("#m"+(+t.dataset.m+1));if(n)n.focus();else{const g=P.querySelector('[data-a="next"]');if(g&&!g.disabled)g.click()}});
/* ---------- fournisseur / vocabulaire ---------- */
const VS=$("#vocsel")||document.createElement("div");if(S.lastFab)V=FABV(S.lastFab);
function vs(){VS.innerHTML=Object.keys(VOC).map(k=>`<button data-k="${k}" aria-pressed="${k===V}">${VOC[k].nom}</button>`).join("")}
VS.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;V=b.dataset.k;vs();render()});
vs();

document.querySelectorAll('[role="tab"]').forEach(t=>t.addEventListener("click",()=>{document.querySelectorAll('[role="tab"]').forEach(x=>x.setAttribute("aria-selected",x===t));["demo","syn","plan"].forEach(k=>$("#v-"+k).hidden=k!==t.dataset.tab)}));

render();

window.PCCotes={S:S,render:render};

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page introuvable · ProClik</title>
<meta name="theme-color" content="#ECEEF2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1E2433" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<script src="/espace/theme.js?v=1"></script>
<style>
/* Page introuvable : même dessin que l'écran de chargement du site (galet, goutte laiton), jour et nuit */
:root{--bg:#ECEEF2;--fg:#0E1322;--muted:#565E73;--acc:#A8823F;--accx:#8A6A2F;--hi:#FFFFFF;--lo:rgba(26,34,64,.2);
  --gal:-7px -7px 16px var(--hi),9px 9px 20px rgba(26,34,64,.27),inset 1.5px 1.5px 1px rgba(255,255,255,.95),inset -1.5px -1.5px 2px rgba(26,34,64,.13);
  --up:-6px -6px 14px var(--hi),7px 7px 16px var(--lo);--lis:0 0 0 1px rgba(168,130,63,.4)}
:root[data-theme="dark"]{--bg:#1E2433;--fg:#F1F3F9;--muted:#B5BDD3;--acc:#D4B483;--accx:#D4B483;--hi:rgba(255,255,255,.06);--lo:rgba(0,0,0,.5);
  --gal:-7px -7px 16px var(--hi),9px 9px 20px rgba(0,0,0,.62),inset 1.5px 1.5px 1px rgba(255,255,255,.07),inset -1.5px -1.5px 2px rgba(0,0,0,.4);--lis:0 0 0 1px rgba(212,180,131,.32)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:Manrope,system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px 16px;text-align:center}
main{display:grid;justify-items:center;gap:30px;max-width:340px}
.ch-z{position:relative;width:96px;height:96px;perspective:420px}
.ch-a{position:absolute;inset:0;border-radius:50%;border:3px solid var(--acc);box-shadow:inset 5px 5px 12px rgba(26,34,64,.16),inset -5px -5px 12px var(--hi),-5px -5px 12px var(--hi),6px 6px 14px rgba(26,34,64,.16);animation:chAnneau 3.4s cubic-bezier(.55,0,.35,1) infinite}
:root[data-theme="dark"] .ch-a{box-shadow:inset 5px 5px 12px rgba(0,0,0,.45),inset -5px -5px 12px rgba(255,255,255,.04),-5px -5px 12px rgba(255,255,255,.04),6px 6px 14px rgba(0,0,0,.45)}
.ch-t{position:absolute;left:50%;bottom:3px;width:8px;height:42px;margin-left:-4px;border-radius:4px;background:var(--acc);transform-origin:50% 100%;transform:scale(1,0);animation:chTige 3.4s linear infinite}
.ch-o{position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--acc);transform:translateY(42px) scale(0);animation:chGoutte 3.4s linear infinite}
.ch-c{position:absolute;inset:42px;border-radius:50%;border:1px solid var(--acc);opacity:0;animation:chRide 3.4s ease-out infinite}
@keyframes chAnneau{0%{transform:translateY(0) rotateX(0) rotateZ(0);opacity:.5}30%{opacity:.5}38%,56%{transform:translateY(0) rotateX(0) rotateZ(0);opacity:1}70%{transform:translate(14px,-10px) rotateZ(-35deg) rotateX(66deg);opacity:.9}80%{transform:translate(34px,-26px) rotateZ(-50deg) rotateX(88deg);opacity:0}81%{transform:translateY(46px) rotateX(70deg);opacity:0}100%{transform:translateY(0) rotateX(0);opacity:.5}}
@keyframes chTige{0%{transform:scale(1.3,0)}10%{transform:scale(1.3,.14)}30%{transform:scale(.6,.86)}36%{transform:scale(.25,.7)}42%,100%{transform:scale(0,0)}}
@keyframes chGoutte{0%{transform:translateY(42px) scale(0)}10%{transform:translateY(38px) scale(1,.8);animation-timing-function:cubic-bezier(.5,0,.3,1)}32%{transform:translateY(2px) scale(.8,1.25)}38%{transform:translateY(0) scale(1.12,.88)}44%,58%{transform:translateY(0) scale(1)}76%{transform:translateY(5px) scale(.4)}88%,100%{transform:translateY(8px) scale(0)}}
@keyframes chRide{0%,58%{inset:42px;opacity:0}62%{opacity:.6}80%,100%{inset:26px;opacity:0}}
@media (prefers-reduced-motion:reduce){.ch-a,.ch-t,.ch-c{animation:none}.ch-a{opacity:1}.ch-o{animation:none;transform:none}}

</style></head><body>
<main>
  <div class="ch-z" aria-hidden="true"><div class="ch-a"></div><i class="ch-t"></i><i class="ch-o"></i><i class="ch-c"></i></div>
  <div>
    <p class="code">ERREUR 404</p>
    <h1>Cette page est partie sur un autre chantier.</h1>
    <p>On a cherché partout, même sous l'établi. Elle a peut-être changé d'adresse, ou le lien comporte une petite faute.</p>
  </div>
  <a class="btn" href="/">Retour à l'accueil<i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></a>
</main>
</body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page introuvable · ProClik</title>
<meta name="theme-color" content="#ECEEF2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1E2433" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<script src="/espace/theme.js?v=1"></script>
<style>
/* Page introuvable : même dessin que l'écran de chargement du site (galet, goutte laiton), jour et nuit */
:root{--bg:#ECEEF2;--fg:#0E1322;--muted:#565E73;--acc:#A8823F;--accx:#8A6A2F;--hi:#FFFFFF;--lo:rgba(26,34,64,.2);
  --gal:-7px -7px 16px var(--hi),9px 9px 20px rgba(26,34,64,.27),inset 1.5px 1.5px 1px rgba(255,255,255,.95),inset -1.5px -1.5px 2px rgba(26,34,64,.13);
  --up:-6px -6px 14px var(--hi),7px 7px 16px var(--lo);--lis:0 0 0 1px rgba(168,130,63,.4)}
:root[data-theme="dark"]{--bg:#1E2433;--fg:#F1F3F9;--muted:#B5BDD3;--acc:#D4B483;--accx:#D4B483;--hi:rgba(255,255,255,.06);--lo:rgba(0,0,0,.5);
  --gal:-7px -7px 16px var(--hi),9px 9px 20px rgba(0,0,0,.62),inset 1.5px 1.5px 1px rgba(255,255,255,.07),inset -1.5px -1.5px 2px rgba(0,0,0,.4);--lis:0 0 0 1px rgba(212,180,131,.32)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:Manrope,system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px 16px;text-align:center}
main{display:grid;justify-items:center;gap:30px;max-width:340px}
.ch-z{position:relative;width:96px;height:96px;perspective:420px}
.ch-g{position:absolute;inset:0;border-radius:50%;background:var(--bg);box-shadow:var(--gal),0 0 0 1px rgba(168,130,63,.35);animation:chBascule 3s cubic-bezier(.65,0,.35,1) infinite}
.ch-g::after{content:"";position:absolute;inset:42px;border-radius:50%;border:1px solid var(--acc);opacity:0;animation:chRide 3s cubic-bezier(.2,.6,.3,1) infinite}
.ch-o{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;background:var(--acc);opacity:0;animation:chGoutte 3s cubic-bezier(.5,0,.3,1) infinite}
@keyframes chGoutte{0%{transform:translateY(-78px) scale(.7,1.25);opacity:0}8%{opacity:1}24%{transform:translateY(0) scale(.7,1.25);animation-timing-function:ease-out}30%{transform:scale(1.35,.65)}38%,52%{transform:scale(1);opacity:1}62%,100%{transform:scale(0);opacity:0}}
@keyframes chRide{0%,24%{inset:42px;opacity:0}26%{opacity:.7}52%,100%{inset:5px;opacity:0}}
@keyframes chBascule{0%,52%{transform:rotateX(0) rotateY(0)}70%{transform:rotateX(58deg) rotateY(18deg)}88%,100%{transform:rotateX(0) rotateY(0)}}
.code{margin:0;font-size:12px;font-weight:800;letter-spacing:.24em;color:var(--accx)}
h1{margin:6px 0 8px;font-size:clamp(24px,6vw,30px);line-height:1.2;letter-spacing:-.01em}
p{margin:0;color:var(--muted);font-size:16px;line-height:1.55}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:0 10px 0 26px;border-radius:999px;background:var(--bg);color:var(--fg);font:600 16px/1 Manrope,system-ui,sans-serif;text-decoration:none;box-shadow:var(--up)}
.btn i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--gal);color:var(--acc)}
.btn svg{width:18px;height:18px}
.btn:active{box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
@media (prefers-reduced-motion:reduce){.ch-g,.ch-g::after{animation:none}.ch-o{animation:none;opacity:1}}
</style></head><body>
<main>
  <div class="ch-z" aria-hidden="true"><div class="ch-g"></div><i class="ch-o"></i></div>
  <div>
    <p class="code">ERREUR 404</p>
    <h1>Cette page est partie sur un autre chantier.</h1>
    <p>On a cherché partout, même sous l'établi. Elle a peut-être changé d'adresse, ou le lien comporte une petite faute.</p>
  </div>
  <a class="btn" href="/">Retour à l'accueil<i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></a>
</main>
</body></html>
